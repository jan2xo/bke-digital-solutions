services:
  app:
    environment:
      - MALWARE_SCANNER_PROVIDER=clamav
      - MALWARE_SCANNER_VERSION=certification
      - MALWARE_SCANNER_HOST=clamav
      - MALWARE_SCANNER_PORT=3310
      - MALWARE_SCANNER_TIMEOUT_MS=30000
      - MALWARE_SCANNER_MAX_BYTES=262144000
    depends_on:
      clamav: { condition: service_healthy }
  scheduler:
  backup-worker:
  migrate:
  seed:
    build:
      context: .
      target: operations
    command: ["npm", "run", "db:seed"]
    env_file: ${BKE_ENV_FILE:-.env.certification}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  smoke:
    build:
      context: .
      target: operations
    command: ["npm", "run", "db:smoke"]
    env_file: ${BKE_ENV_FILE:-.env.certification}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  certification-tests:
    build:
      context: .
      target: operations
    command: ["npm", "run", "certification:vitest"]
    env_file: ${BKE_ENV_FILE:-.env.certification}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      app: { condition: service_healthy }
      caddy: { condition: service_started }
    networks: [private]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next:size=512m,mode=1777
      - /app/node_modules/.vite-temp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    environment:
      NODE_ENV: test
      DEPLOYMENT_ENV: test
      LOCAL_PRODUCTION_SIMULATION: "false"
      APP_URL: https://caddy
      INTERNAL_APP_URL: ""
      PUBLIC_WEBHOOK_ORIGIN: ""
      TRUSTED_ORIGINS: https://caddy
      DIRECT_DATABASE_URL: ""
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bke_certification
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: log
      BKE_DISABLE_EXTERNAL_EMAIL: "true"
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      PLAYWRIGHT_OUTPUT_DIR: /tmp/test-results
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
      npm_config_cache: /tmp/.npm
      PAYMONGO_SECRET_KEY: ""
      PAYMONGO_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      RESEND_SANDBOX_TO: ""
  minio:
    profiles: ["self-hosted-storage"]
    networks: [private]
    ports: !override
      []
  postgres:
    networks: [private]
    ports: []
  valkey:
    networks: [private]
    ports: []
  minio-init:
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - DEPLOYMENT_ENV
      - MC_CONFIG_DIR=/tmp/.mc
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
  caddy:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes: !override
      - ./Caddyfile.certification:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

networks: {}
