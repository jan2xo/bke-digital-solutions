services:
  app:
    environment:
      - MALWARE_SCANNER_PROVIDER=clamav
      - MALWARE_SCANNER_VERSION=certification
      - MALWARE_SCANNER_HOST=clamav
      - MALWARE_SCANNER_PORT=3310
      - MALWARE_SCANNER_TIMEOUT_MS=30000
      - MALWARE_SCANNER_MAX_BYTES=262144000
    depends_on:
      clamav: { condition: service_healthy }
  scheduler:
  backup-worker:
  migrate:
  seed:
    build:
      context: .
      target: operations
    command: ["npm", "run", "db:seed"]
    env_file: ${BKE_ENV_FILE:-.env.certification}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  smoke:
    build:
      context: .
      target: operations
    command: ["npm", "run", "db:smoke"]
    env_file: ${BKE_ENV_FILE:-.env.certification}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  minio:
    profiles: ["self-hosted-storage"]
    networks: [private, certification-host]
    ports: !override
      - "127.0.0.1:59000:9000"
  postgres:
    networks: [private, certification-host]
    ports:
      - "127.0.0.1:55432:5432"
  valkey:
    networks: [private, certification-host]
    ports:
      - "127.0.0.1:56379:6379"
  minio-init:
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - DEPLOYMENT_ENV
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes: !override
      - ./Caddyfile.certification:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

networks:
  certification-host:
