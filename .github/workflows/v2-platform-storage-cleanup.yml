name: Platform - Storage Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/storage-cleanup/**"
      - "apps/web/storage/cleanup.ts"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-storage-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-cleanup-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/|process\.env)' platform/storage-cleanup --include='*.ts'; then
            echo "Storage Cleanup must receive persistence, storage, and eligibility through ports."
            exit 1
          fi
      - name: Reject legacy persistence reach-through in web adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(@/lib|generated/prisma|from ["'"'"']@prisma/)' apps/web/storage/cleanup.ts; then
            echo "Web Storage Cleanup adapter must use platform ports and PostgreSQL persistence only."
            exit 1
          fi
      - name: Reject domain deletion-policy ownership
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(productArtifact|activeReference|Catalog|catalog|entitlement|license|order)' platform/storage-cleanup --include='*.ts' --exclude='*.test.ts'; then
            echo "Storage Cleanup must not decide domain deletion eligibility."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Storage Cleanup platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/storage-cleanup/test/storage-cleanup.test.ts
