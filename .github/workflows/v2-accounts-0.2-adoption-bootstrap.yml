name: Temporary V2 Accounts 0.2 Adoption Bootstrap

on:
  push:
    branches:
      - feat/v2-accounts-0.2.0-adoption
    paths:
      - ".github/workflows/v2-accounts-0.2-adoption-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-accounts-0.2.0-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire Accounts 0.2 purchase access and refresh lock
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected ${label} marker`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one ${label} marker`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedRelease = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.2.0/bke-accounts-0.2.0.tgz';
          if (packageJson.dependencies?.['@bke/accounts'] !== expectedRelease) {
            throw new Error(`@bke/accounts pin drifted: ${packageJson.dependencies?.['@bke/accounts']}`);
          }

          let moduleSource = fs.readFileSync('v2/modules/accounts/module.ts', 'utf8');
          moduleSource = replaceOnce(
            moduleSource,
            'import { ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID } from "@bke/accounts/contracts/account-access.contract";',
            'import { ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID } from "@bke/accounts/contracts/account-access.contract";\nimport { ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID } from "@bke/accounts/contracts/purchase-access.contract";',
            'purchase-access contract import',
          );
          moduleSource = replaceOnce(
            moduleSource,
            'import { createAccountsAccountAccessCapability } from "@bke/accounts/logic/account-access";',
            'import { createAccountsAccountAccessCapability } from "@bke/accounts/logic/account-access";\nimport { createAccountsPurchaseAccessCapability } from "@bke/accounts/logic/purchase-access";',
            'purchase-access logic import',
          );
          moduleSource = replaceOnce(
            moduleSource,
            '  const accountAccess = createAccountsAccountAccessCapability(accountAccessRepository);\n  const switchableAccountList =',
            '  const accountAccess = createAccountsAccountAccessCapability(accountAccessRepository);\n  const purchaseAccess = createAccountsPurchaseAccessCapability(accountAccess);\n  const switchableAccountList =',
            'purchase-access composition',
          );
          moduleSource = replaceOnce(
            moduleSource,
            '      {\n        id: ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID,\n        value: accountAccess,\n      },\n      {\n        id: ACCOUNTS_SWITCHABLE_ACCOUNT_LIST_CAPABILITY_ID,',
            '      {\n        id: ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID,\n        value: accountAccess,\n      },\n      {\n        id: ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID,\n        value: purchaseAccess,\n      },\n      {\n        id: ACCOUNTS_SWITCHABLE_ACCOUNT_LIST_CAPABILITY_ID,',
            'purchase-access capability registration',
          );
          fs.writeFileSync('v2/modules/accounts/module.ts', moduleSource);

          let certSource = fs.readFileSync('v2/modules/accounts/test/consumer-adoption.certify.ts', 'utf8');
          certSource = replaceOnce(
            certSource,
            'https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.1.0/bke-accounts-0.1.0.tgz',
            expectedRelease,
            'consumer release URL',
          );
          certSource = replaceOnce(certSource, 'const EXPECTED_VERSION = "0.1.0";', 'const EXPECTED_VERSION = "0.2.0";', 'consumer version');
          certSource = replaceOnce(
            certSource,
            '  "@bke/accounts/contracts/",\n  "@bke/accounts/logic/",',
            '  "@bke/accounts/contracts/",\n  "@bke/accounts/contracts/purchase-access.contract",\n  "@bke/accounts/logic/",\n  "@bke/accounts/logic/purchase-access",',
            'purchase-access consumer markers',
          );
          fs.writeFileSync('v2/modules/accounts/test/consumer-adoption.certify.ts', certSource);

          let workflowSource = fs.readFileSync('.github/workflows/v2-accounts.yml', 'utf8');
          workflowSource = replaceOnce(workflowSource, '/tmp/bke-accounts-0.1.0.tgz', '/tmp/bke-accounts-0.2.0.tgz', 'workflow artifact path');
          workflowSource = replaceOnce(
            workflowSource,
            'https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.1.0/bke-accounts-0.1.0.tgz',
            expectedRelease,
            'workflow release URL',
          );
          workflowSource = replaceOnce(
            workflowSource,
            '3837547a2d5d5084616d848b9b1a4674cc24a73a1b8285155e148808cdbdd511',
            '409a9ee998f656f96ee3a3d33929eed33416cd591def9eb3509f098429960146',
            'workflow release SHA-256',
          );
          fs.writeFileSync('.github/workflows/v2-accounts.yml', workflowSource);
          NODE

          npm install --package-lock-only --ignore-scripts

          node <<'NODE'
          const lock = require('./package-lock.json');
          const expectedRelease = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.2.0/bke-accounts-0.2.0.tgz';
          const root = lock.packages?.['']?.dependencies?.['@bke/accounts'];
          const installed = lock.packages?.['node_modules/@bke/accounts'];
          if (root !== expectedRelease) throw new Error(`lock root pin mismatch: ${root}`);
          if (installed?.version !== '0.2.0' || installed?.resolved !== expectedRelease || !installed?.integrity) {
            throw new Error(`lock package entry mismatch: ${JSON.stringify(installed)}`);
          }
          console.log(`Accounts 0.2 lock GREEN integrity=${installed.integrity}`);
          NODE

          rm .github/workflows/v2-accounts-0.2-adoption-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v2 accounts): adopt @bke/accounts 0.2.0"
          git push origin HEAD:feat/v2-accounts-0.2.0-adoption
