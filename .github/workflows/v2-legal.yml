name: V2 Module - Legal

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/legal/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-legal.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_legal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_legal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_legal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Legal package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-legal-0.2.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/legal-v0.2.0/bke-legal-0.2.0.tgz
          echo "b832cf35c7cba79c73671b8a9e583ba0f9fb3111b535b97f5297e992d495fe04  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Legal standalone consumer adoption and staging retirement
        run: npx tsx v2/modules/legal/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate installed Legal Prisma schema
        run: npx prisma validate --schema node_modules/@bke/legal/prisma/schema.prisma
      - name: Apply installed Legal baseline
        run: node v2/platform/persistence/migration-compositor.mjs legal node_modules/@bke/legal/migrations
      - name: Prove installed Legal migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs legal node_modules/@bke/legal/migrations
