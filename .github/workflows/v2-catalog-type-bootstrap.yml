name: V2 Catalog Type Bootstrap

on:
  push:
    branches: [feat/v2-catalog-foundation]
    paths:
      - ".github/workflows/v2-catalog-type-bootstrap.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply contextual typing fix
        shell: python
        run: |
          from pathlib import Path

          logic = Path("v2/modules/catalog/logic/catalog.ts")
          text = logic.read_text()
          text = text.replace(
              'export function createCatalogLookupCapability(repository: CatalogRepository): CatalogLookupCapability {\n  return Object.freeze({',
              'export function createCatalogLookupCapability(repository: CatalogRepository): CatalogLookupCapability {\n  const capability: CatalogLookupCapability = {',
              1,
          )
          marker = '\n  });\n}\n\nexport function createCatalogManagementCapability'
          replacement = '\n  };\n  return Object.freeze(capability);\n}\n\nexport function createCatalogManagementCapability'
          if marker not in text:
              raise SystemExit("lookup closing marker not found")
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              'export function createCatalogManagementCapability(repository: CatalogRepository): CatalogManagementCapability {\n  return Object.freeze({',
              'export function createCatalogManagementCapability(repository: CatalogRepository): CatalogManagementCapability {\n  const capability: CatalogManagementCapability = {',
              1,
          )
          if not text.endswith('\n  });\n}\n'):
              raise SystemExit("management closing marker not found")
          text = text[:-len('\n  });\n}\n')] + '\n  };\n  return Object.freeze(capability);\n}\n'
          logic.write_text(text)

          repo = Path("v2/modules/catalog/prisma/repositories/postgres-catalog-repository.ts")
          text = repo.read_text()
          text = text.replace(
              '  return Object.freeze({\n    async findProductById',
              '  const repository: CatalogRepository = {\n    async findProductById',
              1,
          )
          if not text.endswith('\n  });\n}\n'):
              raise SystemExit("repository closing marker not found")
          text = text[:-len('\n  });\n}\n')] + '\n  };\n  return Object.freeze(repository);\n}\n'
          repo.write_text(text)
      - name: Commit typing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/modules/catalog/logic/catalog.ts v2/modules/catalog/prisma/repositories/postgres-catalog-repository.ts
          git commit -m "fix(v2 catalog): preserve capability contextual typing"
          git push origin HEAD:feat/v2-catalog-foundation
