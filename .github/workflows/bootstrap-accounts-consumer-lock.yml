name: Bootstrap Accounts Consumer Lockfile

on:
  push:
    branches: [feat/v2-accounts-consumer-adoption]
    paths:
      - ".github/workflows/bootstrap-accounts-consumer-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-accounts-consumer-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh locked package metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(v2): lock certified Accounts package artifact"
          git push origin HEAD:feat/v2-accounts-consumer-adoption
