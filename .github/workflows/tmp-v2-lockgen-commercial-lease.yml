name: Temporary V2 lockfile generation

on:
  push:
    branches:
      - tmp/v2-lockgen-commercial-lease

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v2-lockgen-commercial-lease
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate package lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate V2 package lock"
          git push origin HEAD:tmp/v2-lockgen-commercial-lease
