name: V2 Catalog Retirement Bootstrap

on:
  push:
    branches: [feat/v2-catalog-staging-retirement]
    paths:
      - ".github/workflows/v2-catalog-retirement-bootstrap.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete redundant Catalog staging implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            v2/modules/catalog/contracts \
            v2/modules/catalog/docs \
            v2/modules/catalog/logic \
            v2/modules/catalog/prisma
          rm -f \
            v2/modules/catalog/module.manifest.ts \
            v2/modules/catalog/vitest.config.ts \
            v2/modules/catalog/test/catalog.test.ts \
            v2/modules/catalog/test/extraction.certify.ts \
            v2/modules/catalog/test/postgres.certify.ts
          test -f v2/modules/catalog/module.ts
          test -f v2/modules/catalog/test/consumer-adoption.certify.ts
      - name: Commit staging retirement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-catalog-retirement-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v2/modules/catalog .github/workflows/v2-catalog-retirement-bootstrap.yml
          git commit -m "refactor(v2 catalog): retire staging implementation"
          git push origin HEAD:feat/v2-catalog-staging-retirement
