name: V2 Module - Payments

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/payments/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-payments.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Payments package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-payments-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/payments-v0.1.0/bke-payments-0.1.0.tgz
          echo "d28c5fd37360e717416c4827c4aba48bf960685f324565b7ae0ca948eb318f41  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Payments consumer adoption while staging remains
        run: npx tsx v2/modules/payments/test/consumer-adoption.certify.ts
      - name: Certify Payments staging extraction boundary
        run: npx tsx v2/modules/payments/test/extraction.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate installed Payments Prisma schema
        run: npx prisma validate --schema node_modules/@bke/payments/prisma/schema.prisma
      - name: Apply installed Payments migrations
        run: node v2/platform/persistence/migration-compositor.mjs payments node_modules/@bke/payments/migrations
      - name: Prove installed Payments migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs payments node_modules/@bke/payments/migrations
      - name: Regression-test Payments staging capabilities
        run: npx vitest run --config v2/vitest.config.ts v2/modules/payments/test/checkout-attempt.test.ts v2/modules/payments/test/provider-event-ingestion.test.ts v2/modules/payments/test/settlement-fact.test.ts v2/modules/payments/test/refund-initiation.test.ts
      - name: Regression-test PayMongo staging adapter
        run: npx vitest run --config v2/vitest.config.ts v2/modules/payments/test/paymongo-adapter.test.ts
      - name: Certify Payments checkout attempt with PostgreSQL
        run: npx tsx v2/modules/payments/test/checkout-attempt.postgres.certify.ts
      - name: Certify Payments provider-event ingestion with PostgreSQL
        run: npx tsx v2/modules/payments/test/provider-event-ingestion.postgres.certify.ts
      - name: Certify Payments settlement fact with PostgreSQL
        run: npx tsx v2/modules/payments/test/settlement-fact.postgres.certify.ts
      - name: Certify Payments refund initiation with PostgreSQL
        run: npx tsx v2/modules/payments/test/refund-initiation.postgres.certify.ts
      - name: Test package-backed Payments module composition
        run: npx vitest run --config v2/vitest.config.ts v2/modules/payments/test/module-composition.test.ts
