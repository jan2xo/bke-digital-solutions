name: Security lock refresh

on:
  push:
    branches:
      - feat/v2-host-standalone-convergence

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-standalone-convergence
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lock for pinned Next security update
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.4
      - name: Commit generated lock if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): refresh lock for Next 16.3.4"
          git push origin HEAD:feat/v2-host-standalone-convergence
