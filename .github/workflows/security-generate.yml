name: Security Dependency Generator Command

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: security-generate-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Authorize and dispatch exact dependency generator
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/security-generate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: security-generate-dispatch-pr-269
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/security-generate-policy.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate requester, PR identity, and live head; dispatch fixed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const policy = require("./scripts/security-generate-policy.cjs");
            const expectedRepo = policy.REPOSITORY;
            const expectedPr = policy.PULL_REQUEST;
            const expectedBranch = policy.HEAD_BRANCH;
            const workflowId = "ci.yml";
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const association = comment?.author_association ?? "NONE";

            async function ledger(message) {
              await github.rest.issues.createComment({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                issue_number: expectedPr,
                body: message,
              });
            }

            try {
              if (context.repo.owner + "/" + context.repo.repo !== expectedRepo ||
                  issue?.number !== expectedPr || !issue.pull_request) {
                throw new Error("Command is restricted to the designated dependency-remediation pull request.");
              }

              let permissionLevel = null;
              const repositoryOwnerComment =
                association === "OWNER" && comment?.user?.login === policy.OWNER;
              if (!repositoryOwnerComment) {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  username: comment?.user?.login ?? "",
                });
                permissionLevel = permission.data.permission;
              }

              const authorization = policy.authorizeCommenter({
                association,
                login: comment?.user?.login,
                permission: permissionLevel,
              });
              if (!authorization.ok) {
                core.notice("Ignored /security-generate: " + authorization.reason + ".");
                return;
              }

              const prResponse = await github.rest.pulls.get({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                pull_number: expectedPr,
              });
              const pr = prResponse.data;
              const branchRef = await github.rest.repos.getBranch({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                branch: expectedBranch,
              });
              const sourceSha = pr.head?.sha ?? "";

              const target = policy.validateTarget({
                contextRepository: context.repo.owner + "/" + context.repo.repo,
                issueNumber: issue.number,
                isPullRequest: Boolean(issue.pull_request),
                prState: pr.state,
                baseRef: pr.base?.ref ?? "",
                baseRepository: pr.base?.repo?.full_name ?? "",
                headRef: pr.head?.ref ?? "",
                headRepository: pr.head?.repo?.full_name ?? "",
                sourceSha,
                branchSha: branchRef.data.commit.sha,
              });
              if (!target.ok) throw new Error(target.reason);

              const recentRuns = await github.rest.actions.listWorkflowRuns({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                workflow_id: workflowId,
                branch: expectedBranch,
                event: "workflow_dispatch",
                per_page: 100,
              });
              const priorRunIds = new Set(recentRuns.data.workflow_runs.map((run) => run.id));

              for (const priorRun of recentRuns.data.workflow_runs) {
                if (priorRun.head_sha !== sourceSha) continue;

                const priorJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  run_id: priorRun.id,
                  per_page: 100,
                });
                const generator = priorJobs.data.jobs.find((job) =>
                  job.name === policy.GENERATOR_JOB
                );

                let artifact = null;
                if (generator?.conclusion === "success") {
                  const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                    owner: "jan2xo",
                    repo: "bke-digital-solutions",
                    run_id: priorRun.id,
                    per_page: 100,
                  });
                  artifact = artifacts.data.artifacts.find((item) =>
                    policy.artifactBelongsToRun(item, { sourceSha, runId: priorRun.id })
                  ) ?? null;
                }

                const decision = policy.classifyPriorRun({
                  run: priorRun,
                  sourceSha,
                  generatorJob: generator,
                  artifact,
                });

                if (decision.action === "reject") {
                  await ledger(
                    "## /security-generate — duplicate safely rejected\n\n" +
                    "An exact-head workflow already exists: [" + priorRun.id + "](" +
                    priorRun.html_url + "). " + decision.reason + ". No second dispatch was issued."
                  );
                  core.notice("Suppressed duplicate exact-head dispatch: " + decision.reason + ".");
                  return;
                }

                if (decision.action === "reuse") {
                  await ledger(
                    "## /security-generate — existing exact-head artifact reused\n\n" +
                    "- Source SHA: `" + sourceSha + "`\n" +
                    "- Workflow run: [" + priorRun.id + "](" + priorRun.html_url + ")\n" +
                    "- CI conclusion: `" + (priorRun.conclusion ?? "not completed") + "` (not used as generator success evidence)\n" +
                    "- Generator conclusion: `success`\n" +
                    "- Artifact ID: `" + decision.artifactId + "`\n" +
                    "- Artifact archive digest: `" + (artifact.digest ?? "not returned by GitHub") + "`\n\n" +
                    "The generator job succeeded and the unexpired artifact is bound to this exact run and SHA. No duplicate npm generation was dispatched."
                  );
                  core.notice("Reused exact-head generator artifact from run " + priorRun.id + ".");
                  return;
                }
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                workflow_id: workflowId,
                ref: expectedBranch,
                inputs: {
                  source_sha: sourceSha,
                  security_generator: "true",
                },
              });

              // The workflow_dispatch API returns 204 rather than a run ID.
              // Report a run only after a new exact-head CI run exposes the
              // dedicated, non-skipped generator job. No timestamp attribution.
              let observedRun = null;
              for (let attempt = 0; attempt < 10; attempt += 1) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  workflow_id: workflowId,
                  branch: expectedBranch,
                  event: "workflow_dispatch",
                  per_page: 100,
                });
                const candidates = runs.data.workflow_runs.filter((run) =>
                  !priorRunIds.has(run.id) &&
                  run.head_sha === sourceSha &&
                  run.head_branch === expectedBranch
                );

                for (const candidate of candidates) {
                  const candidateJobs = await github.rest.actions.listJobsForWorkflowRun({
                    owner: "jan2xo",
                    repo: "bke-digital-solutions",
                    run_id: candidate.id,
                    per_page: 100,
                  });
                  const candidateGenerator = candidateJobs.data.jobs.find((job) =>
                    job.name === policy.GENERATOR_JOB
                  );
                  if (policy.correlateGeneratorRun({
                    candidateRun: candidate,
                    priorRunIds,
                    sourceSha,
                    generatorJob: candidateGenerator,
                  })) {
                    observedRun = candidate;
                    break;
                  }
                }
                if (observedRun) break;
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }

              if (!observedRun) {
                await ledger(
                  "## /security-generate — dispatch accepted; run not yet positively correlated\n\n" +
                  "GitHub accepted the fixed workflow dispatch for exact source SHA `" + sourceSha +
                  "`, but no new run with the dedicated generator job was visible during the bounded observation window. " +
                  "No run ID, artifact, or success is claimed. Reconcile the Actions run ledger before retrying."
                );
                core.setFailed("Dispatch accepted but positive exact-head generator-run correlation was not established.");
                return;
              }

              await ledger(
                "## /security-generate — exact-head generator run observed\n\n" +
                "- PR: #269 (`" + expectedBranch + "`)\n" +
                "- Source SHA: `" + sourceSha + "`\n" +
                "- Workflow run: [" + observedRun.id + "](" + observedRun.html_url + ")\n" +
                "- Status at observation: `" + observedRun.status + "`\n\n" +
                "The named generator job is present on a new exact-head run. Completion and artifact integrity are reported separately."
              );
              core.notice("Observed exact-head generator run " + observedRun.id + " for " + sourceSha + ".");
            } catch (error) {
              const message = String(error?.message ?? error).slice(0, 1200);
              await ledger(
                "## /security-generate — rejected or failed\n\n" +
                "The trusted controller did not establish a valid dispatch.\n\n" +
                "- Requester: `" + (comment?.user?.login ?? "unknown") + "`\n" +
                "- Reason: " + message.replace(/\n/g, " ") + "\n\n" +
                "No generator result or artifact is claimed."
              );
              core.setFailed(message);
            }

  report:
    name: Return generator result to PR ledger
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'fix/v3-production-dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/security-generate-policy.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify generator job and report exact-head artifact result
        uses: actions/github-script@v7
        with:
          script: |
            const policy = require("./scripts/security-generate-policy.cjs");
            const run = context.payload.workflow_run;
            if (run.repository?.full_name !== policy.REPOSITORY ||
                run.head_repository?.full_name !== policy.REPOSITORY) {
              core.notice("Ignored workflow run whose repository provenance is not canonical.");
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha ?? "")) {
              core.setFailed("Workflow run did not carry a valid exact head SHA.");
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              run_id: run.id,
              per_page: 100,
            });
            const generator = jobsResponse.data.jobs.find((job) =>
              job.name === policy.GENERATOR_JOB
            );
            if (!generator || generator.conclusion === "skipped") {
              core.notice("No positive generator-job evidence in this workflow run; ignored.");
              return;
            }
            if (!["success", "failure", "cancelled", "timed_out", "action_required"].includes(generator.conclusion)) {
              core.setFailed("Generator job has not reached a terminal, reportable conclusion.");
              return;
            }

            const prResponse = await github.rest.pulls.get({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              pull_number: policy.PULL_REQUEST,
            });
            const pr = prResponse.data;
            const currentHeadMatches =
              pr.state === "open" &&
              pr.head?.ref === policy.HEAD_BRANCH &&
              pr.head?.sha === run.head_sha;

            let artifact = null;
            if (generator.conclusion === "success") {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                run_id: run.id,
                per_page: 100,
              });
              artifact = artifacts.data.artifacts.find((item) =>
                policy.artifactBelongsToRun(item, { sourceSha: run.head_sha, runId: run.id })
              ) ?? null;
            }

            let body =
              "## /security-generate — completed exact-head result\n\n" +
              "- Workflow run: [" + run.id + "](" + run.html_url + ")\n" +
              "- Workflow head branch: `" + run.head_branch + "`\n" +
              "- Exact source SHA: `" + run.head_sha + "`\n" +
              "- Generator job conclusion: `" + generator.conclusion + "`\n" +
              "- Current PR head matches run SHA: `" + currentHeadMatches + "`\n";

            if (generator.conclusion === "success" && artifact) {
              body +=
                "- Artifact: `" + artifact.name + "`\n" +
                "- Artifact ID: `" + artifact.id + "`\n" +
                "- Artifact archive digest: `" + (artifact.digest ?? "not returned by GitHub") + "`\n" +
                "- Artifact expired: `" + artifact.expired + "`\n\n" +
                "The generator job succeeded and GitHub exposes its exact-run artifact. Its internal SHA-256 manifest must still be independently verified before applying dependency bytes.";
            } else if (generator.conclusion === "success") {
              body +=
                "- Artifact: **MISSING** (expected exact-head artifact not found or expired)\n\n" +
                "The generator job passed but no usable exact-head artifact was exposed. Treat generation as incomplete.";
              core.setFailed("Generator succeeded without its expected exact-head artifact.");
            } else {
              body +=
                "\nGenerator failure/cancellation is recorded. Review the linked Actions run logs; no dependency bytes are accepted.";
              core.setFailed("Dependency generator concluded " + generator.conclusion + ".");
            }

            if (!currentHeadMatches) {
              body +=
                "\n\n**STALE RESULT:** PR #269 no longer points at this source SHA. The run is evidence for its recorded commit only and must not be applied to the current PR head.";
            }

            await github.rest.issues.createComment({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              issue_number: policy.PULL_REQUEST,
              body,
            });
            core.notice("Reported generator run " + run.id + " and exact SHA " + run.head_sha + " to PR #269.");
