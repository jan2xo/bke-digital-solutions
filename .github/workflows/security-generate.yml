name: Security Dependency Generator Command

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: security-generate-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Authorize and dispatch exact dependency generator
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/security-generate'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Validate requester, PR identity, and live head; dispatch fixed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const expectedRepo = "jan2xo/bke-digital-solutions";
            const expectedPr = 269;
            const expectedBase = "main";
            const expectedBranch = "fix/v3-production-dependency-security";
            const workflowId = "ci.yml";
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const association = comment?.author_association ?? "NONE";
            const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);

            // Ignore unauthorized authors without exposing repository metadata.
            if (!allowedAssociations.has(association) || !comment?.user?.login) {
              core.notice("Ignored /security-generate from an unauthorized author association.");
              return;
            }

            const isVerifiedRepositoryOwner =
              comment.user.login === "jan2xo" && association === "OWNER";

            async function ledger(message) {
              await github.rest.issues.createComment({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                issue_number: expectedPr,
                body: message,
              });
            }

            try {
              // The fixed repository owner is independently anchored by both the
              // OWNER association and the known owner login. Other accepted GitHub
              // associations must pass the repository's permission-level API check.
              if (!isVerifiedRepositoryOwner) {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  username: comment.user.login,
                });
                if (!["admin", "maintain", "write"].includes(permission.data.permission)) {
                  core.notice("Ignored /security-generate: commenter lacks repository write permission.");
                  return;
                }
              }

              if (context.repo.owner + "/" + context.repo.repo !== expectedRepo ||
                  issue.number !== expectedPr || !issue.pull_request) {
                throw new Error("Command is restricted to the designated dependency-remediation pull request.");
              }

              const prResponse = await github.rest.pulls.get({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                pull_number: expectedPr,
              });
              const pr = prResponse.data;

              if (pr.state !== "open" ||
                  pr.base?.ref !== expectedBase ||
                  pr.base?.repo?.full_name !== expectedRepo ||
                  pr.head?.ref !== expectedBranch ||
                  pr.head?.repo?.full_name !== expectedRepo) {
                throw new Error("PR state, base, head branch, or head repository does not match the fixed allowlist.");
              }

              const sourceSha = pr.head?.sha ?? "";
              if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
                throw new Error("GitHub did not return a valid exact 40-character PR head SHA.");
              }

              // Independently resolve the branch ref to detect head drift before dispatch.
              const branch = await github.rest.repos.getBranch({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                branch: expectedBranch,
              });
              if (branch.data.commit.sha !== sourceSha) {
                throw new Error("PR head and branch ref differ; refusing stale or ambiguous dispatch.");
              }

              // Reject a duplicate command while an exact-head generator is queued or running.
              const recentRuns = await github.rest.actions.listWorkflowRuns({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                workflow_id: workflowId,
                branch: expectedBranch,
                event: "workflow_dispatch",
                per_page: 50,
              });
              // Refuse ambiguous queue state before dispatch. GitHub's job API can
              // lag the workflow-run API, and an empty job list is not proof that
              // no generator is queued.
              const unresolvedQueue = recentRuns.data.workflow_runs.find((run) =>
                run.head_sha === sourceSha &&
                ["queued", "in_progress", "waiting", "requested"].includes(run.status)
              );
              if (unresolvedQueue) {
                const visibleJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  run_id: unresolvedQueue.id,
                  per_page: 100,
                });
                const visibleGenerator = visibleJobs.data.jobs.find((job) =>
                  job.name === "Guarded production dependency generator"
                );
                if (!visibleGenerator || visibleGenerator.conclusion == null) {
                  await ledger(
                    "## /security-generate — duplicate safely rejected\\n\\n" +
                    "An exact-head workflow is queued or running: [" + unresolvedQueue.id + "](" +
                    unresolvedQueue.html_url + "). GitHub has not exposed terminal generator evidence; " +
                    "no second dispatch was issued."
                  );
                  core.notice("Suppressed duplicate dispatch for unresolved run " + unresolvedQueue.id + ".");
                  return;
                }
              }

              const priorRunIds = new Set(recentRuns.data.workflow_runs.map((run) => run.id));
              for (const priorRun of recentRuns.data.workflow_runs) {
                if (priorRun.head_sha !== sourceSha) continue;

                const priorJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  run_id: priorRun.id,
                  per_page: 100,
                });
                const priorGenerator = priorJobs.data.jobs.find((job) =>
                  job.name === "Guarded production dependency generator"
                );

                if (["queued", "in_progress", "waiting", "requested"].includes(priorRun.status)) {
                  // Treat absence of the job row as queued generator work, not as
                  // permission to dispatch a second copy.
                  if (!priorGenerator || priorGenerator.conclusion == null) {
                    await ledger(
                      "## /security-generate — duplicate safely rejected\\n\\n" +
                      "An exact-head CI run is queued or running: [" + priorRun.id + "](" +
                      priorRun.html_url + "). Its generator state is not yet terminal. No second dispatch was issued."
                    );
                    core.notice("Rejected duplicate command while exact-head run " + priorRun.id + " remains active.");
                    return;
                  }
                  if (priorGenerator.conclusion === "success") {
                    const activeArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
                      owner: "jan2xo",
                      repo: "bke-digital-solutions",
                      run_id: priorRun.id,
                      per_page: 100,
                    });
                    const activeArtifact = activeArtifacts.data.artifacts.find((item) =>
                      item.name === "bke-production-dependency-repair-" + sourceSha &&
                      !item.expired &&
                      item.workflow_run?.id === priorRun.id
                    );
                    if (activeArtifact) {
                      await ledger(
                        "## /security-generate — active run already produced exact-head artifact\\n\\n" +
                        "- Source SHA: `" + sourceSha + "`\\n" +
                        "- Workflow run: [" + priorRun.id + "](" + priorRun.html_url + ")\\n" +
                        "- Artifact ID: `" + activeArtifact.id + "`\\n\\n" +
                        "The generator job has succeeded and the exact-head artifact is present. No duplicate dispatch was issued."
                      );
                      core.notice("Reused artifact from active run " + priorRun.id + ".");
                      return;
                    }
                    await ledger(
                      "## /security-generate — duplicate safely rejected\\n\\n" +
                      "The exact-head generator job succeeded in [" + priorRun.id + "](" +
                      priorRun.html_url + "), but the expected unexpired artifact is not yet visible. " +
                      "No duplicate dispatch was issued; reconcile the run artifact ledger."
                    );
                    core.notice("Generator succeeded but expected artifact is not visible; duplicate dispatch suppressed.");
                    return;
                  }
                }

                // A successful generator job is reusable independently of the
                // overall CI run conclusion (e.g. the separate audit job may fail).
                if (priorGenerator?.conclusion === "success") {
                  const priorArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
                    owner: "jan2xo",
                    repo: "bke-digital-solutions",
                    run_id: priorRun.id,
                    per_page: 100,
                  });
                  const expectedArtifact = priorArtifacts.data.artifacts.find((item) =>
                    item.name === "bke-production-dependency-repair-" + sourceSha &&
                    !item.expired &&
                    item.workflow_run?.id === priorRun.id
                  );
                  if (expectedArtifact) {
                    await ledger(
                      "## /security-generate — existing exact-head artifact reused\\n\\n" +
                      "- Source SHA: `" + sourceSha + "`\\n" +
                      "- Workflow run: [" + priorRun.id + "](" + priorRun.html_url + ")\\n" +
                      "- CI conclusion: `" + priorRun.conclusion + "` (not used as generator success evidence)\\n" +
                      "- Generator conclusion: `success`\\n" +
                      "- Artifact ID: `" + expectedArtifact.id + "`\\n" +
                      "- Artifact archive digest: `" + (expectedArtifact.digest ?? "not returned by GitHub") + "`\\n\\n" +
                      "The generator job succeeded and GitHub exposes its unexpired artifact bound to this exact run and source SHA. No duplicate npm generation was dispatched."
                    );
                    core.notice("Reused exact-head generator artifact from run " + priorRun.id + ".");
                    return;
                  }
                }
              }

              const dispatchStartedAt = Date.now();
              await github.rest.actions.createWorkflowDispatch({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                workflow_id: workflowId,
                ref: expectedBranch,
                inputs: {
                  source_sha: sourceSha,
                  security_generator: "true",
                },
              });

              // The dispatch API returns 204, not a run ID. Observe the resulting run
              // and report it only after GitHub exposes the exact branch/SHA tuple.
              let observedRun = null;
              for (let attempt = 0; attempt < 10; attempt += 1) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: "jan2xo",
                  repo: "bke-digital-solutions",
                  workflow_id: workflowId,
                  branch: expectedBranch,
                  event: "workflow_dispatch",
                  per_page: 50,
                });
                const candidates = runs.data.workflow_runs.filter((run) =>
                  !priorRunIds.has(run.id) &&
                  run.head_sha === sourceSha &&
                  run.head_branch === expectedBranch
                );
                for (const candidate of candidates) {
                  const candidateJobs = await github.rest.actions.listJobsForWorkflowRun({
                    owner: "jan2xo",
                    repo: "bke-digital-solutions",
                    run_id: candidate.id,
                    per_page: 100,
                  });
                  const candidateGenerator = candidateJobs.data.jobs.find((job) =>
                    job.name === "Guarded production dependency generator"
                  );
                  if (candidateGenerator && candidateGenerator.conclusion !== "skipped") {
                    observedRun = candidate;
                    break;
                  }
                }
                if (observedRun) break;
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }

              if (!observedRun) {
                await ledger(
                  "## /security-generate — dispatch accepted; run not yet observable\n\n" +
                  "GitHub accepted the fixed workflow dispatch for exact source SHA `" + sourceSha +
                  "`, but no matching Actions run was visible during the bounded observation window. " +
                  "No run ID, artifact, or successful result is claimed. FORGE must reconcile the run ledger."
                );
                core.setFailed("Dispatch accepted but exact-head workflow run was not observable.");
                return;
              }

              await ledger(
                "## /security-generate — exact-head run observed\n\n" +
                "- PR: #269 (`" + expectedBranch + "`)\n" +
                "- Source SHA: `" + sourceSha + "`\n" +
                "- Workflow run: [" + observedRun.id + "](" + observedRun.html_url + ")\n" +
                "- Status at dispatch observation: `" + observedRun.status + "`\n\n" +
                "This confirms dispatch/run identity only. Generator success and artifact integrity are reported separately after the run completes."
              );
              core.notice("Observed workflow run " + observedRun.id + " for exact source SHA " + sourceSha + ".");
            } catch (error) {
              const message = String(error?.message ?? error).slice(0, 1200);
              await ledger(
                "## /security-generate — rejected or failed\n\n" +
                "The trusted controller did not establish a valid dispatch.\n\n" +
                "- Requester: `" + comment.user.login + "`\n" +
                "- Reason: " + message.replace(/\n/g, " ") + "\n\n" +
                "No generator result or artifact is claimed."
              );
              core.setFailed(message);
            }

  report:
    name: Return generator result to PR ledger
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'fix/v3-production-dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Verify generator job and report exact-head artifact result
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const expectedShaPattern = /^[0-9a-f]{40}$/;
            if (run.repository?.full_name !== "jan2xo/bke-digital-solutions" ||
                run.head_repository?.full_name !== "jan2xo/bke-digital-solutions") {
              core.notice("Ignored workflow run whose repository provenance is not the canonical repository.");
              return;
            }
            if (!expectedShaPattern.test(run.head_sha ?? "")) {
              core.setFailed("Workflow run did not carry a valid exact head SHA.");
              return;
            }

            // The exact generator job name is positive evidence that this was
            // generator-mode CI, not an ordinary certification dispatch.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              run_id: run.id,
              per_page: 100,
            });
            const generator = jobsResponse.data.jobs.find((job) =>
              job.name === "Guarded production dependency generator"
            );

            // No ledger claim is made without positive evidence of the named job.
            if (!generator || generator.conclusion === "skipped") {
              core.notice("No generator job evidence in this workflow run; ignored.");
              return;
            }
            if (!["success", "failure", "cancelled", "timed_out", "action_required"].includes(generator.conclusion)) {
              core.setFailed("Generator job has not reached a terminal, reportable conclusion.");
              return;
            }

            const prResponse = await github.rest.pulls.get({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              pull_number: 269,
            });
            const pr = prResponse.data;
            const currentHeadMatches =
              pr.state === "open" &&
              pr.head?.ref === "fix/v3-production-dependency-security" &&
              pr.head?.sha === run.head_sha;

            let artifact = null;
            if (generator.conclusion === "success") {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: "jan2xo",
                repo: "bke-digital-solutions",
                run_id: run.id,
                per_page: 100,
              });
              const expectedName = "bke-production-dependency-repair-" + run.head_sha;
              artifact = artifacts.data.artifacts.find((item) =>
                item.name === expectedName &&
                !item.expired &&
                item.workflow_run?.id === run.id
              ) ?? null;
            }

            let body =
              "## /security-generate — completed exact-head result\n\n" +
              "- Workflow run: [" + run.id + "](" + run.html_url + ")\n" +
              "- Workflow head branch: `" + run.head_branch + "`\n" +
              "- Exact source SHA: `" + run.head_sha + "`\n" +
              "- Generator job conclusion: `" + generator.conclusion + "`\n" +
              "- Current PR head matches run SHA: `" + currentHeadMatches + "`\n";

            if (generator.conclusion === "success" && artifact) {
              body +=
                "- Artifact: `" + artifact.name + "`\n" +
                "- Artifact ID: `" + artifact.id + "`\n" +
                "- Artifact archive digest: `" + (artifact.digest ?? "not returned by GitHub") + "`\n" +
                "- Artifact expired: `" + artifact.expired + "`\n\n" +
                "The run completed and GitHub exposes the exact-head artifact. Its internal dependency SHA-256 manifest remains to be independently checked before applying bytes.";
            } else if (generator.conclusion === "success") {
              body +=
                "- Artifact: **MISSING** (expected exact-head artifact not found or expired)\n\n" +
                "The generator job passed but no usable exact-head artifact was exposed. Treat generation as incomplete.";
              core.setFailed("Generator succeeded without its expected exact-head artifact.");
            } else {
              body +=
                "\nGenerator failure/cancellation is recorded. Review the linked Actions run logs; no dependency bytes are accepted.";
              core.setFailed("Dependency generator concluded " + generator.conclusion + ".");
            }

            if (!currentHeadMatches) {
              body +=
                "\n\n**STALE RESULT:** PR #269 no longer points at this source SHA. The run is evidence for its recorded commit only and must not be applied to the current PR head.";
            }

            await github.rest.issues.createComment({
              owner: "jan2xo",
              repo: "bke-digital-solutions",
              issue_number: 269,
              body,
            });
            core.notice("Reported generator run " + run.id + " and exact SHA " + run.head_sha + " to PR #269.");
