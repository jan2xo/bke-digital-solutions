name: V2 Catalog Adoption Lock Bootstrap

on:
  push:
    branches: [feat/v2-catalog-consumer-adoption]
    paths:
      - ".github/workflows/v2-catalog-adoption-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin certified Catalog release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@bke/catalog'] = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/catalog-v0.1.0/bke-catalog-0.1.0.tgz';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit package pin and lock
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-catalog-adoption-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/v2-catalog-adoption-lock-bootstrap.yml
          git commit -m "build(v2 catalog): pin @bke/catalog 0.1.0"
          git push origin HEAD:feat/v2-catalog-consumer-adoption
