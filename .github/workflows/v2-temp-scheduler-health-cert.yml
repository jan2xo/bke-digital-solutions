name: Temporary V2 Scheduler Health Certification

on:
  push:
    branches: [feat/v2-scheduler-health-convergence]
    paths:
      - ".github/workflows/v2-temp-scheduler-health-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
      PAYMENT_PROVIDER: mock
      EMAIL_FROM: test@example.com
      S3_BUCKET: test
      CRON_SECRET: ci-cron-secret-with-at-least-32-chars
      LICENSE_SIGNING_KEY_ID: ci-license-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: git diff --exit-code -- v2/platform/host/generated/prisma
      - run: npx vitest run --config v2/vitest.config.ts v2/platform/scheduler/test/scheduler.test.ts v2/platform/scheduler/test/health.test.ts
      - run: npm run typecheck
      - name: Generate disposable build signing keys
        run: |
          npm run licensing:keys .certification-secrets
          {
            echo 'LICENSE_SIGNING_PRIVATE_KEY<<BKE_PRIVATE_KEY'
            cat .certification-secrets/license-signing-private.pem
            echo 'BKE_PRIVATE_KEY'
            echo 'LICENSE_SIGNING_PUBLIC_KEY<<BKE_PUBLIC_KEY'
            cat .certification-secrets/license-signing-public.pem
            echo 'BKE_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: git diff --check

  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run unchanged V1 dependency scanner
        run: node v2/tooling/check-host-v1-dependencies.mjs
