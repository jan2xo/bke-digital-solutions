name: Bootstrap Accounts Host Adapter Cutover

on:
  push:
    branches: [feat/v2-accounts-consumer-adoption]
    paths:
      - ".github/workflows/bootstrap-accounts-consumer-adapter.yml"

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-accounts-consumer-adoption
          fetch-depth: 0
      - name: Rewrite only host composition imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path('v2/modules/accounts/module.ts')
          text = module.read_text()
          replacements = {
              '"./contracts/': '"@bke/accounts/contracts/',
              '"./logic/': '"@bke/accounts/logic/',
              '"./providers/': '"@bke/accounts/providers/',
              '"./prisma/repositories/': '"@bke/accounts/prisma/repositories/',
              '"./module.manifest"': '"@bke/accounts/module.manifest"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          module.write_text(text)

          next_config = Path('next.config.ts')
          text = next_config.read_text()
          text = text.replace(
              'transpilePackages: ["@bke/identity"],',
              'transpilePackages: ["@bke/identity", "@bke/accounts"],',
          )
          next_config.write_text(text)

          identity_cert = Path('v2/modules/identity/test/consumer-adoption.certify.ts')
          text = identity_cert.read_text()
          text = text.replace(
              'if (!nextConfigSource.includes(\'transpilePackages: ["@bke/identity"]\')) {\n  throw new Error(\n    "Next.js must explicitly transpile the source-native @bke/identity package.",\n  );\n}',
              'if (!nextConfigSource.includes(\'"@bke/identity"\')) {\n  throw new Error(\n    "Next.js must explicitly transpile the source-native @bke/identity package.",\n  );\n}',
          )
          identity_cert.write_text(text)
          PY

      - name: Commit adapter cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/modules/accounts/module.ts next.config.ts v2/modules/identity/test/consumer-adoption.certify.ts
          git commit -m "refactor(v2): consume certified Accounts package surfaces"
          git push origin HEAD:feat/v2-accounts-consumer-adoption
