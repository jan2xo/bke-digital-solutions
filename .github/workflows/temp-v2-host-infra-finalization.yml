name: Temporary V2 Host Infrastructure Finalization

on:
  push:
    branches:
      - feat/v2-host-infrastructure-finalization

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-infrastructure-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move host infrastructure into V2 and rewrite exact imports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/platform/host/config v2/platform/host/security
          cp lib/config/environment.ts v2/platform/host/config/environment.ts
          cp lib/env.ts v2/platform/host/env.ts
          cp lib/db.ts v2/platform/host/db.ts
          cp lib/security/crypto.ts v2/platform/host/security/crypto.ts
          cp lib/security/request.ts v2/platform/host/security/request.ts
          cp lib/security/session-display.ts v2/platform/host/security/session-display.ts
          python - <<'PY'
          from pathlib import Path
          replacements = {
              '@/lib/config/environment': '@/v2/platform/host/config/environment',
              '@/lib/env': '@/v2/platform/host/env',
              '@/lib/db': '@/v2/platform/host/db',
              '@/lib/security/crypto': '@/v2/platform/host/security/crypto',
              '@/lib/security/request': '@/v2/platform/host/security/request',
              '@/lib/security/session-display': '@/v2/platform/host/security/session-display',
          }
          allowed = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}
          skip = {'.git', 'node_modules', '.next'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in allowed or any(part in skip for part in path.parts):
                  continue
              text = path.read_text()
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new)
          PY
          rm lib/config/environment.ts lib/env.ts lib/db.ts lib/security/crypto.ts lib/security/request.ts lib/security/session-display.ts
          rm .github/workflows/temp-v2-host-infra-finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(v2 host): own host infrastructure under v2"
          git push origin HEAD:feat/v2-host-infrastructure-finalization
