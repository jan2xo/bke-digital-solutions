name: Intent Certification
run-name: "PR #${{ github.event.issue.number || inputs.pr_number || 'manual' }} - Intent Certification"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
      targets:
        description: Space/comma-separated certification targets, or full
        required: true
        type: string
      pr_number:
        description: Optional exact PR number for dispatch-based PR certification
        required: false
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: intent-certification-${{ (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/certify ') || startsWith(github.event.comment.body, 'BKE CERTIFY ')) && github.event.issue.number) || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve certification intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/certify ') || startsWith(github.event.comment.body, 'BKE CERTIFY ')))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
    steps:
      - id: plan
        name: Resolve exact head and targets
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const allowedTargets = [
              "core",
              "pr",
              "accounts",
              "agent-store",
              "catalog",
              "commerce",
              "composition",
              "echo",
              "entitlements",
              "host",
              "identity",
              "legal",
              "licensing",
              "notifications",
              "payments",
              "platform",
              "prisma-isolation",
              "standalone",
              "native-account",
            ];

            let sourceSha;
            let requested;
            let prNumber;
            let activePr;

            if (context.eventName === "issue_comment") {
              const association = context.payload.comment?.author_association ?? "NONE";
              const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              if (!allowedAssociations.has(association)) {
                core.setFailed(`Certification command rejected for author association ${association}.`);
                return;
              }

              const issue = context.payload.issue;
              if (!issue?.pull_request) {
                core.setFailed("Certification commands are valid only on pull requests.");
                return;
              }

              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              activePr = response.data;
              prNumber = issue.number;
              sourceSha = response.data.head.sha;
              requested = (context.payload.comment?.body ?? "")
                .replace(/^(?:\/certify|BKE CERTIFY)\s+/i, "")
                .trim();
            } else {
              sourceSha = (process.env.DISPATCH_SHA ?? "").trim();
              requested = (process.env.DISPATCH_TARGETS ?? "").trim();
              const rawPr = (process.env.DISPATCH_PR_NUMBER ?? "").trim();
              if (rawPr) {
                prNumber = Number(rawPr);
                if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
                  core.setFailed("PR number must be a positive integer."); return;
                }
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
                });
                activePr = response.data;
                if (activePr.head.sha !== sourceSha) {
                  core.setFailed("Dispatched SHA is not the exact current PR head."); return;
                }
              }
            }

            if (!/^[0-9a-f]{40}$/i.test(sourceSha ?? "")) {
              core.setFailed("Certification requires an exact 40-character source SHA.");
              return;
            }

            const tokens = [...new Set(
              requested
                .toLowerCase()
                .split(/[\s,]+/)
                .map((value) => value.trim())
                .filter(Boolean),
            )];

            if (tokens.length === 0) {
              core.setFailed("No certification targets were declared.");
              return;
            }

            let targets;
            if (tokens.includes("full") || tokens.includes("all")) {
              targets = allowedTargets.filter((target) => target !== "pr");
            } else {
              const unknown = tokens.filter((target) => !allowedTargets.includes(target));
              if (unknown.length > 0) {
                core.setFailed(
                  `Unknown certification target(s): ${unknown.join(", ")}. Allowed: ${allowedTargets.join(", ")}.`,
                );
                return;
              }
              targets = tokens;
            }

            // The PR manifest is the certification-plan authority whenever present.
            // It must be read from the immutable PR head, not the default branch.
            if (prNumber && activePr && activePr.state === "open" &&
                activePr.head.repo?.full_name === context.repo.owner + "/" + context.repo.repo) {
              const manifestFile = ".github/pr-certification/pr-" + prNumber + ".json";
              let response;
              try {
                response = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo,
                  path: manifestFile, ref: sourceSha,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (response) {
                if (Array.isArray(response.data) || response.data.type !== "file" ||
                    response.data.encoding !== "base64") {
                  core.setFailed("PR certification manifest is not a file."); return;
                }
                const plan = JSON.parse(Buffer.from(response.data.content, "base64").toString("utf8"));
                const required = plan.requiredTargets;
                if (tokens.includes("full") || tokens.includes("all")) targets = [...targets, "pr"];
                if (plan.schemaVersion !== 1 || plan.pr !== prNumber || !Array.isArray(required) ||
                    !required.includes("pr") || new Set(required).size !== required.length ||
                    !required.every((target) => allowedTargets.includes(target) && targets.includes(target))) {
                  core.setFailed("PR #"+prNumber+" requires its declared exact-head graph, not a partial proof."); return;
                }
              } else if (targets.includes("pr")) {
                core.setFailed("PR #"+prNumber+" is missing its branch-owned certification manifest."); return;
              }
            } else if (targets.includes("pr")) {
              core.setFailed("PR-specific certification requires an open same-repository PR."); return;
            }

            core.setOutput("source_sha", sourceSha);
            core.setOutput("targets_json", JSON.stringify(targets));
            core.setOutput("pr_number", String(prNumber ?? ""));
            await core.summary
              .addHeading("BKE certification plan")
              .addRaw(`Exact source SHA: \`${sourceSha}\`\n\n`)
              .addRaw(`Targets: \`${targets.join(", ")}\`\n`)
              .write();

  pr:
    name: "PR #${{ needs.plan.outputs.pr_number }} - scoped branch certification"
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'pr')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact PR candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Execute branch-authored PR #${{ needs.plan.outputs.pr_number }} certification"
        run: node scripts/ci/pr-certification.mjs

  core:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'core')
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  accounts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'accounts')
    uses: ./.github/workflows/v2-accounts.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  agent-store:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'agent-store')
    uses: ./.github/workflows/v2-agent-store.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  catalog:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'catalog')
    uses: ./.github/workflows/v2-catalog.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  commerce:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'commerce')
    uses: ./.github/workflows/v2-commerce.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  composition:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'composition')
    uses: ./.github/workflows/v2-composition.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  echo:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'echo')
    uses: ./.github/workflows/v2-echo.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  entitlements:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'entitlements')
    uses: ./.github/workflows/v2-entitlements.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  host:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'host')
    uses: ./.github/workflows/v2-host-v1-free.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  identity:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'identity')
    uses: ./.github/workflows/v2-identity.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  legal:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'legal')
    uses: ./.github/workflows/v2-legal.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  licensing:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'licensing')
    uses: ./.github/workflows/v2-licensing.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  notifications:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'notifications')
    uses: ./.github/workflows/v2-notifications.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  payments:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'payments')
    uses: ./.github/workflows/v2-payments.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  platform:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'platform')
    uses: ./.github/workflows/v2-platform.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  prisma-isolation:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'prisma-isolation')
    uses: ./.github/workflows/v2-prisma-isolation.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  standalone:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'standalone')
    uses: ./.github/workflows/v2-standalone.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  native-account:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'native-account')
    uses: ./.github/workflows/native-bke-account-handoff.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs:
      - plan
      - pr
      - core
      - accounts
      - agent-store
      - catalog
      - commerce
      - composition
      - echo
      - entitlements
      - host
      - identity
      - legal
      - licensing
      - notifications
      - payments
      - platform
      - prisma-isolation
      - standalone
      - native-account
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARGETS_JSON: ${{ needs.plan.outputs.targets_json }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify declared certification plan
        shell: bash
        run: |
          node <<'NODE'
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = [];

          for (const target of targets) {
            const result = needs[target]?.result;
            if (result !== "success") {
              failed.push(`${target}=${result ?? "missing"}`);
            }
          }

          if (failed.length > 0) {
            console.error(
              `Required certification failed for ${process.env.SOURCE_SHA}: ${failed.join(", ")}`,
            );
            process.exit(1);
          }

          console.log(
            `Required certification PASS for ${process.env.SOURCE_SHA}: ${targets.join(", ")}`,
          );
          NODE
      - name: Write exact-head certification summary
        shell: bash
        run: |
          {
            echo "## Required certification PASS"
            echo
            echo "Exact source SHA: \`$SOURCE_SHA\`"
            echo
            echo "Declared targets: \`$TARGETS_JSON\`"
          } >> "$GITHUB_STEP_SUMMARY"
