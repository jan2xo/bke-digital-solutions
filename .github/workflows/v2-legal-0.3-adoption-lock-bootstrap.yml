name: V2 Legal 0.3 Adoption Lock Bootstrap

on:
  push:
    branches: [feat/v2-legal-0.3-adoption]
    paths:
      - ".github/workflows/v2-legal-0.3-adoption-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-legal-0.3-adoption
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin certified Legal release
        run: npm install --save-exact "@bke/legal@https://github.com/jan2xo/bke-libraries-typescript/releases/download/legal-v0.3.0/bke-legal-0.3.0.tgz"
      - name: Commit package pin and lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/v2-legal-0.3-adoption-lock-bootstrap.yml
          git commit -m "build(v2 legal): pin @bke/legal 0.3.0"
          git push origin HEAD:feat/v2-legal-0.3-adoption
