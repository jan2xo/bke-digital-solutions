name: Platform - Scheduler

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/scheduler/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/)' platform/scheduler --include='*.ts'; then
            echo "Scheduler platform seam must not reach through legacy, domain packages, or Prisma."
            exit 1
          fi
      - name: Reject domain job ownership
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(commissioning\.evidence|storage\.lifecycle|email\.outbox|subscriptions\.renewal-reminders|entitlements\.expiration|commerce\.lifecycle|customers\.retention-review|security\.expired-records|payments\.operations|renewals\.prepared-recovery|backups\.daily|backups\.retention)' platform/scheduler --include='*.ts' --exclude='*.test.ts'; then
            echo "Scheduler platform seam must not own concrete domain job registry entries."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Scheduler platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/scheduler/test/scheduler.test.ts
