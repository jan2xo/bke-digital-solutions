name: Repair consumer certification paths

on:
  push:
    branches:
      - refactor/flatten-v2-layout
    paths:
      - ".github/workflows/repair-consumer-cert-paths.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/flatten-v2-layout
          fetch-depth: 0
      - name: Retarget moved consumer certifications to repository root
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path("modules").glob("*/test/consumer-adoption.certify.ts")):
              text = path.read_text()
              repaired = text.replace("../../../../", "../../../")
              if repaired != text:
                  path.write_text(repaired)
                  changed.append(str(path))

          print("repaired:")
          for path in changed:
              print(path)
          PY

          if git grep -n 'new URL("../../../../' -- 'modules/*/test/consumer-adoption.certify.ts'; then
            echo "stale four-level consumer certification path remains" >&2
            exit 1
          fi
          git diff --check
      - name: Commit certification path repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No remaining certification path changes needed."
            exit 0
          fi
          git config user.name "jan2xo"
          git config user.email "163499503+jan2xo@users.noreply.github.com"
          git add modules/*/test/consumer-adoption.certify.ts
          git commit -m "fix: retarget consumer certifications to repository root"
          git push origin HEAD:refactor/flatten-v2-layout
