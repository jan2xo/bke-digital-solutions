name: V2 Module - Notifications

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/notifications/**"
      - "v2/apps/standalone/**"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Notifications package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-notifications-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/notifications-v0.1.0/bke-notifications-0.1.0.tgz
          echo "9a9c5640ed27332886e54c491cb6b54fdcc6561ec100ddd2476adb02d93ee406  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Notifications consumer adoption and staging retirement
        run: npx tsx v2/modules/notifications/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
