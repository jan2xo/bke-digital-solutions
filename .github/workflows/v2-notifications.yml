name: V2 Module - Notifications

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/notifications/**"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Notifications extraction boundary
        run: npx tsx v2/modules/notifications/test/extraction.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Test Notifications intent capability
        run: npx vitest run --config v2/vitest.config.ts v2/modules/notifications/test/notification-intent.test.ts
