name: V2 Identity Library Lock Sync

on:
  push:
    branches: [feat/v2-identity-library-consumer]
    paths:
      - "package.json"
      - ".github/workflows/v2-identity-library-lock-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-identity-library-consumer
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile from pinned Identity release
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify pinned Identity lock entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.1.0/bke-identity-0.1.0.tgz';
          if (lock.packages?.['']?.dependencies?.['@bke/identity'] !== expected) {
            throw new Error('Root lock dependency does not pin the certified Identity release URL.');
          }
          const identity = lock.packages?.['node_modules/@bke/identity'];
          if (!identity || identity.version !== '0.1.0' || identity.resolved !== expected || !identity.integrity) {
            throw new Error(`Unexpected @bke/identity lock entry: ${JSON.stringify(identity)}`);
          }
          console.log(`Identity lock entry GREEN integrity=${identity.integrity}`);
          NODE

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(identity): lock standalone library artifact"
          git push origin HEAD:feat/v2-identity-library-consumer
