name: "TEMPORARY — owner comment to protected preproduction Prisma dispatch"

# TEMPORARY: remove after a fully verified preproduction schema migration.
# This adapter never receives Neon or Infisical secrets; it only invokes workflow_dispatch.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  owner-comment-dispatch:
    name: "Pinned owner issue #378 → official Prisma operator"
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'jan2xo/bke-digital-solutions' &&
      github.event.issue.number == 378 &&
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/preproduction-prisma apply ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: "Authorize exact owner, issue, main SHA and single-purpose command"
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullRepo = owner + "/" + repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const body = comment?.body ?? "";
            const command = /^\/preproduction-prisma apply ([a-f0-9]{40}) APPLY_OFFICIAL_PRISMA_TO_FRESH_BKE_PREPRODUCTION$/.exec(body);
            if (context.eventName !== "issue_comment" ||
                context.payload.action !== "created" ||
                fullRepo !== "jan2xo/bke-digital-solutions" ||
                owner !== "jan2xo" || context.actor !== owner ||
                comment?.user?.login !== owner ||
                issue?.number !== 378 || issue?.pull_request || issue?.state !== "open" ||
                context.ref !== "refs/heads/main" ||
                process.env.WORKFLOW_SHA !== context.sha ||
                process.env.WORKFLOW_REF !== fullRepo +
                  "/.github/workflows/preproduction-prisma-comment-dispatch.yml@refs/heads/main" ||
                !command || body !== body.trim()) {
              throw new Error("TEMP_PREPRODUCTION_PRISMA_DENIED_OWNER_ISSUE_COMMAND_REQUIRED");
            }
            const source = command[1];
            const main = await github.rest.git.getRef({owner, repo, ref: "heads/main"});
            if (source !== context.sha || source !== main.data.object.sha) {
              throw new Error("TEMP_PREPRODUCTION_PRISMA_DENIED_STALE_EXACT_MAIN");
            }
            const workflow = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: "preproduction-prisma.yml",
            });
            if (workflow.data.path !== ".github/workflows/preproduction-prisma.yml" ||
                workflow.data.state !== "active") {
              throw new Error("TEMP_PREPRODUCTION_PRISMA_DENIED_OPERATOR_NOT_ACTIVE");
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: "preproduction-prisma.yml", ref: "main",
              inputs: {
                source_sha: source,
                mode: "apply_official_migrations",
                confirmation: "APPLY_OFFICIAL_PRISMA_TO_FRESH_BKE_PREPRODUCTION",
              },
            });
            core.info("PASS: protected official preproduction Prisma workflow dispatched for exact main " + source);
            await core.summary.addHeading("Temporary preproduction Prisma dispatch")
              .addRaw("Owner-only issue #378 and exact current main verified.\n\n")
              .addRaw("Dispatched protected preproduction-prisma.yml (no secrets or SQL here).\n")
              .write();
