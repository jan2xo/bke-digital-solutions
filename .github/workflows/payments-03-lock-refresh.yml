name: Payments 0.3 lock refresh

on:
  push:
    branches:
      - feat/v2-host-standalone-convergence

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-standalone-convergence
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin released Payments 0.3.0 and refresh lock
        run: npm install --save-exact 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/payments-v0.3.0/bke-payments-0.3.0.tgz'
      - name: Commit dependency metadata if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(v2 payments): pin released 0.3.0"
          git push origin HEAD:feat/v2-host-standalone-convergence
