name: Temporary V2 Auth Finalization

on:
  push:
    branches:
      - feat/v2-host-infrastructure-finalization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-infrastructure-finalization
          fetch-depth: 0
      - name: Rewire legacy auth imports and retire facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='@/lib/auth'
          new='@/v2/apps/web/auth/session'
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in {'.ts','.tsx','.js','.jsx','.mjs','.cjs'}:
                  continue
              if any(x in p.parts for x in {'.git','node_modules','.next'}):
                  continue
              text=p.read_text(errors='ignore')
              changed=text.replace(old,new)
              if changed!=text:
                  p.write_text(changed)
          PY
          rm lib/auth.ts
          rm .github/workflows/temp-v2-auth-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(v2 auth): retire legacy auth facade"
          git push origin HEAD:feat/v2-host-infrastructure-finalization
