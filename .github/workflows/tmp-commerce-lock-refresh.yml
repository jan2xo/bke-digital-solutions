name: Temporary Commerce lock refresh

on:
  push:
    branches: [feat/v2-host-standalone-convergence]
    paths:
      - "package.json"
      - ".github/workflows/tmp-commerce-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-standalone-convergence
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only npm-generated lock metadata
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -vE '^ M package-lock\.json$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "$unexpected"
            echo "::error::Lock refresh touched files other than package-lock.json"
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "::error::Expected package-lock.json to change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh Commerce 0.8.0 lock"
          git push origin HEAD:feat/v2-host-standalone-convergence
