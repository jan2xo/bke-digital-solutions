name: Platform - Providers

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/providers/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-providers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  providers-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/|process\.env)' platform/providers --include='*.ts'; then
            echo "Provider platform seam must receive persistence/runtime configuration through ports."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Provider platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/providers/test/providers.test.ts
