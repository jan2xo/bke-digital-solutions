name: Platform - Providers

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  providers-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/|process\.env)' platform/providers --include='*.ts'; then
            echo "Provider platform seam must receive persistence/runtime configuration through ports."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Provider platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/providers/test/providers.test.ts
