name: TEMP V2 Signing Registry Retirement

on:
  push:
    branches:
      - tmp/v2-signing-registry-retirement
    paths:
      - ".github/workflows/tmp-signing-registry-retirement.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v2-signing-registry-retirement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current locked dependencies
        run: npm ci
      - name: Apply asserted signing-registry retirement patch
        run: python3 scripts/tmp-signing-registry-retirement-patch.py
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Reinstall regenerated lock
        run: npm ci
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Licensing consumer adoption
        run: npx tsx v2/modules/licensing/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified candidate code files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            v2/modules/licensing/module.ts \
            v2/modules/licensing/test/consumer-adoption.certify.ts \
            v2/apps/web/licensing/signing-key-registry.ts \
            app/api/licensing/keys/route.ts \
            app/api/licenses/refresh/route.ts
          git diff --cached --exit-code && { echo "No candidate changes produced"; exit 1; } || true
          git commit -m "refactor(v2): retire legacy licensing signing registry"
          git push origin HEAD:tmp/v2-signing-registry-retirement
