name: Module - Echo

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/echo/**"
      - "contracts/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - ".github/workflows/v2-echo.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Test Echo module
        run: npx vitest run --config vitest.architecture.config.ts modules/echo/test/echo.test.ts
