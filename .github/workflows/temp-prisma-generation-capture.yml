name: TEMP Prisma Generation Capture

on:
  push:
    branches:
      - feat/v3-digital-notification-center
    paths:
      - "prisma/schema.prisma"
      - ".github/workflows/temp-prisma-generation-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: notification-center-generated-prisma
          path: platform/persistence/generated/prisma
          if-no-files-found: error
          retention-days: 1
