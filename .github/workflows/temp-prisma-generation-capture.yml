name: TEMP Prisma Generation Capture

on:
  push:
    branches:
      - feat/v3-digital-notification-center
    paths:
      - "prisma/schema.prisma"
      - ".github/workflows/temp-prisma-generation-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_codegen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v3-digital-notification-center
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Commit canonical generated Prisma client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/persistence/generated/prisma
          if git diff --cached --quiet; then
            echo "Generated Prisma client already canonical."
            exit 0
          fi
          git commit -m "chore(prisma): regenerate notification center client"
          git push origin HEAD:feat/v3-digital-notification-center
