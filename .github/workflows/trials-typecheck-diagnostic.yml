name: Trials Typecheck Diagnostic

on:
  push:
    branches:
      - feat/v2-trials-release-adoption

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-trials-release-adoption
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          mkdir -p .github/diagnostics
          cp typecheck.log .github/diagnostics/trials-typecheck.log
          cp typecheck.exit .github/diagnostics/trials-typecheck.exit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/trials-typecheck.log .github/diagnostics/trials-typecheck.exit
          git commit -m "ci(v2 trials): expose typecheck diagnostics"
          git push origin HEAD:feat/v2-trials-release-adoption
