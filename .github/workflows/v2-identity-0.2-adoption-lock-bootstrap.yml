name: V2 Identity 0.2 Adoption Lock Bootstrap

on:
  push:
    branches:
      - feat/v2-identity-0.2-adoption
    paths:
      - ".github/workflows/v2-identity-0.2-adoption-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-identity-0.2-adoption
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin certified Identity release
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts \
            @bke/identity@https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.2.0/bke-identity-0.2.0.tgz
      - name: Commit package pin and lock
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-identity-0.2-adoption-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/v2-identity-0.2-adoption-lock-bootstrap.yml
          git commit -m "build(v2 identity): pin @bke/identity 0.2.0"
          git push origin HEAD:feat/v2-identity-0.2-adoption
