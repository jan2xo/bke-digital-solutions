name: V2 Web Host Import Bootstrap

on:
  push:
    branches: [feat/v2-host-v1-extermination]
    paths:
      - ".github/workflows/v2-web-host-import-bootstrap.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route production host imports to V2-owned web infrastructure
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app components -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print)
          for file in "${files[@]}"; do
            sed -i \
              -e 's#@/lib/security/request#@/v2/apps/web/http/request#g' \
              -e 's#@/lib/security/rate-limit#@/v2/apps/web/http/rate-limit#g' \
              -e 's#@/lib/http#@/v2/apps/web/http/api-error#g' \
              -e 's#@/lib/validation#@/v2/apps/web/http/validation#g' \
              "$file"
          done
          if grep -R -n -E '@/lib/(security/request|security/rate-limit|http|validation)' app components --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx'; then
            echo 'Legacy web-host imports remain.' >&2
            exit 1
          fi
      - name: Commit host infrastructure import migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          if git diff --cached --quiet; then
            echo 'Web-host imports already current'
            exit 0
          fi
          git commit -m "refactor(v2 web): route host infrastructure imports"
          git push origin HEAD:feat/v2-host-v1-extermination
