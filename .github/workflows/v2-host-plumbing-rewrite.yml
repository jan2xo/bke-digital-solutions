name: V2 Host Plumbing Rewrite

on:
  push:
    branches:
      - feat/v2-host-standalone-convergence
    paths:
      - .github/workflows/v2-host-plumbing-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.ref == 'refs/heads/feat/v2-host-standalone-convergence'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-standalone-convergence
          fetch-depth: 0
      - name: Replace V1 host plumbing imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}
          roots = [Path('app'), Path('components')]
          standalone = [Path('middleware.ts'), Path('middleware.tsx'), Path('proxy.ts'), Path('instrumentation.ts'), Path('instrumentation-client.ts')]
          replacements = {
              '@/lib/security/request': '@/v2/apps/web/http/request',
              '@/lib/security/rate-limit': '@/v2/apps/web/http/rate-limit',
              '@/lib/http': '@/v2/apps/web/http/api-error',
          }
          counts = {key: 0 for key in replacements}
          changed = []

          candidates = []
          for base in roots:
              if base.exists():
                  candidates.extend(path for path in base.rglob('*') if path.is_file() and path.suffix in suffixes)
          candidates.extend(path for path in standalone if path.exists())

          for path in sorted(set(candidates)):
              original = path.read_text()
              updated = original
              local_changes = 0
              for old, new in replacements.items():
                  occurrences = updated.count(old)
                  if occurrences:
                      updated = updated.replace(old, new)
                      counts[old] += occurrences
                      local_changes += occurrences
              if updated != original:
                  path.write_text(updated)
                  changed.append((str(path), local_changes))

          missing = [old for old, count in counts.items() if count == 0]
          if missing:
              raise SystemExit(f'Expected rewrite target had zero matches: {missing}')

          print('Replacement counts:')
          for old, count in counts.items():
              print(f'  {old}: {count}')
          print(f'Changed files: {len(changed)}')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY
      - name: Verify no production importer still uses replaced V1 plumbing
        shell: bash
        run: |
          if grep -R -n -E '@/lib/security/(request|rate-limit)|@/lib/http' app components --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.cjs'; then
            echo 'V1 host plumbing import remained after rewrite.' >&2
            exit 1
          fi
      - name: Commit rewrite and self-delete
        shell: bash
        run: |
          rm .github/workflows/v2-host-plumbing-rewrite.yml
          git config user.name 'jan2xo'
          git config user.email '163499503+jan2xo@users.noreply.github.com'
          git add app components middleware.ts middleware.tsx proxy.ts instrumentation.ts instrumentation-client.ts .github/workflows/v2-host-plumbing-rewrite.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No rewrite changes were staged.' >&2
            exit 1
          fi
          git commit -m 'refactor(v2 host): move shared HTTP plumbing to V2'
          git push origin HEAD:feat/v2-host-standalone-convergence
