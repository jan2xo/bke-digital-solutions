name: V2 Accounts 0.2 Lock Bootstrap

on:
  push:
    branches: [feat/v2-accounts-0.2-purchase-access-adoption]
    paths:
      - ".github/workflows/v2-accounts-0.2-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-accounts-0.2-purchase-access-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin Accounts 0.2 and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact "@bke/accounts@https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.2.0/bke-accounts-0.2.0.tgz" --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/v2-accounts-0.2-lock-bootstrap.yml
          git commit -m "build(v2 accounts): pin @bke/accounts 0.2.0"
          git push origin HEAD:feat/v2-accounts-0.2-purchase-access-adoption
