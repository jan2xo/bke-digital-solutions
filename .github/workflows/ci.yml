name: Prepare V1 Prisma client
on:
  push:
    branches: [work/v1-semi-annual-prisma]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: git diff --binary -- generated/prisma > prisma-generated.patch
      - run: sha256sum prisma/schema.prisma > schema.sha256
      - run: git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-semi-annual-prisma
          path: |
            prisma-generated.patch
            schema.sha256
            source-sha.txt
          if-no-files-found: error
          retention-days: 7
