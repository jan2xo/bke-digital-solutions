name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: bke, POSTGRES_PASSWORD: bke, POSTGRES_DB: bke_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
      PAYMENT_PROVIDER: mock
      EMAIL_FROM: test@example.com
      S3_BUCKET: test
      CRON_SECRET: ci-cron-secret-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
