name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
      security_generator:
        description: Run the guarded production dependency remediation generator
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.security_generator == true && format('digital-solutions-generator-{0}', inputs.source_sha || github.ref) || format('digital-solutions-ci-{0}', inputs.source_sha || github.ref) }}
  cancel-in-progress: ${{ inputs.security_generator != true }}

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  NODE_ENV: test
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
  SESSION_SECRET: ci-session-secret-with-at-least-32-chars
  LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
  PAYMENT_PROVIDER: mock
  EMAIL_FROM: test@example.com
  S3_BUCKET: test
  CRON_SECRET: ci-cron-secret-with-at-least-32-chars
  LICENSE_SIGNING_KEY_ID: ci-license-signing-key

jobs:
  security-dependency-generator:
    name: Guarded production dependency generator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.security_generator == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Require authorized branch and exact source head
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          EXPECTED_BRANCH: fix/v3-production-dependency-security
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$DISPATCH_SHA" = "$GITHUB_SHA"
          test "${#DISPATCH_SHA}" -eq 40
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checked-out source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/fix/v3-production-dependency-security"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Generate pinned production dependency repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          const dependencies = pkg.dependencies ?? {};
          const devDependencies = pkg.devDependencies ?? {};
          const overrides = pkg.overrides ?? {};
          const baseline = [
            ["dependencies", dependencies, "@prisma/adapter-pg", "7.9.1"],
            ["dependencies", dependencies, "@prisma/client", "7.9.1"],
            ["dependencies", dependencies, "next", "16.3.6"],
            ["dependencies", dependencies, "zod", "^4.1.5"],
            ["devDependencies", devDependencies, "prisma", "7.9.1"],
            ["overrides", overrides, "fast-uri", "3.1.5"],
            ["overrides", overrides, "sharp", "0.35.3"],
          ];
          for (const [scope, values, name, expected] of baseline) {
            if (values[name] !== expected) {
              throw new Error("Unexpected " + scope + "." + name + " baseline; stop for re-audit");
            }
          }
          if (overrides["source-map-js"] !== undefined) {
            throw new Error("Unexpected source-map-js override baseline; stop for re-audit");
          }
          pkg.dependencies = {
            ...dependencies,
            "@prisma/adapter-pg": "7.10.1",
            "@prisma/client": "7.10.1",
            next: "16.4.5",
            zod: "4.6.7",
          };
          pkg.devDependencies = { ...devDependencies, prisma: "7.10.1" };
          pkg.overrides = {
            ...overrides,
            "fast-uri": "3.1.9",
            sharp: "0.35.5",
            "source-map-js": "1.2.2",
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache" --registry "https://registry.npmjs.org/"
      - name: Verify clean reproducible install
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --cache "$RUNNER_TEMP/npm-cache" --registry "https://registry.npmjs.org/"
      - name: Enforce production critical and high advisory policy
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev --audit-level=high
      - name: Verify Next.js and Prisma compatibility
        run: |
          set -euo pipefail
          npm run db:generate
          git diff --exit-code -- platform/persistence/generated/prisma
          npx prisma validate
          npm run lint
          npm run typecheck
      - name: Produce integrity manifest
        run: |
          set -euo pipefail
          git rev-parse HEAD > dependency-remediation.source
          sha256sum package.json package-lock.json > dependency-remediation.sha256
          cat dependency-remediation.source
          cat dependency-remediation.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bke-production-dependency-repair-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.source
            dependency-remediation.sha256
          if-no-files-found: error
          retention-days: 7

  database-tests:
    name: Database contracts + runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate test configuration
        run: npm run config:validate
        env:
          DEPLOYMENT_ENV: test
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Require generated Prisma to be committed
        run: git diff --exit-code -- platform/persistence/generated/prisma
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Verify database migration status
        run: npm run db:status
      - name: Run post-migration smoke
        run: npm run db:smoke
      - name: Seed disposable test database
        run: npm run db:seed
      - name: Generate disposable test signing keys
        run: |
          npm run licensing:keys .certification-secrets
          {
            echo 'LICENSE_SIGNING_PRIVATE_KEY<<BKE_PRIVATE_KEY'
            cat .certification-secrets/license-signing-private.pem
            echo 'BKE_PRIVATE_KEY'
            echo 'LICENSE_SIGNING_PUBLIC_KEY<<BKE_PUBLIC_KEY'
            cat .certification-secrets/license-signing-public.pem
            echo 'BKE_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
      - name: Run runtime test suite
        run: npm test

  code-quality-build:
    name: Code quality + application build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Generate disposable build signing keys
        run: |
          npm run licensing:keys .certification-secrets
          {
            echo 'LICENSE_SIGNING_PRIVATE_KEY<<BKE_PRIVATE_KEY'
            cat .certification-secrets/license-signing-private.pem
            echo 'BKE_PRIVATE_KEY'
            echo 'LICENSE_SIGNING_PUBLIC_KEY<<BKE_PUBLIC_KEY'
            cat .certification-secrets/license-signing-public.pem
            echo 'BKE_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Bash operator syntax
        run: bash -n bke.sh scripts/v3-ops.sh scripts/deploy-production.sh
      - name: Validate disposable operator syntax
        run: |
          node --check scripts/v3-disposable-env.mjs
          node --check scripts/v3-disposable-compose.mjs
          node --check scripts/v3-disposable-doctor.mjs
      - name: Build application
        run: npm run build
      - name: Repository diff hygiene
        run: git diff --check

  security:
    name: Repository + dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository security hygiene
        run: npm run security:hygiene
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  deployment-containers:
    name: Deployment contracts + container builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare canonical runtime environment
        run: cp .env.example .env
      - name: Verify restart policy contract
        run: npm run deployment:verify-restart
      - name: Verify deployment manifest
        run: npm run deployment:verify-manifest
      - name: Validate production Compose
        run: docker compose --env-file .env -f docker-compose.production.yml config --quiet
      - name: Validate disposable Compose overlay
        run: |
          cp .env.example .env.certification
          docker compose --env-file .env.certification -f docker-compose.production.yml -f docker-compose.disposable.yml config --quiet
          rm .env.certification
      - name: Build migrations container
        run: docker build --target migrations -t bke-digital-solutions-migrations:ci .
      - name: Build application runner container
        run: docker build --target runner -t bke-digital-solutions:ci .

  required-certification:
    name: Required certification
    if: ${{ always() }}
    needs:
      - database-tests
      - code-quality-build
      - security
      - deployment-containers
    runs-on: ubuntu-latest
    steps:
      - name: Require every core CI module
        env:
          DATABASE_TESTS: ${{ needs.database-tests.result }}
          CODE_QUALITY_BUILD: ${{ needs.code-quality-build.result }}
          SECURITY: ${{ needs.security.result }}
          DEPLOYMENT_CONTAINERS: ${{ needs.deployment-containers.result }}
        run: |
          for value in "$DATABASE_TESTS" "$CODE_QUALITY_BUILD" "$SECURITY" "$DEPLOYMENT_CONTAINERS"; do
            test "$value" = "success" || { echo "Required core CI module did not pass: $value"; exit 1; }
          done
          echo "Required Digital Solutions certification: PASS"
