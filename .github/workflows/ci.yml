name: CI
on: [push, pull_request]

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: bke, POSTGRES_PASSWORD: bke, POSTGRES_DB: bke_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
      PAYMENT_PROVIDER: mock
      EMAIL_FROM: test@example.com
      S3_BUCKET: test
      CRON_SECRET: ci-cron-secret-with-at-least-32-chars
      LICENSE_SIGNING_KEY_ID: ci-license-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run config:validate
        env:
          DEPLOYMENT_ENV: test
      - run: npm run db:generate
      - name: Verify generated Prisma client is committed
        run: |
          git diff -- generated/prisma
          git diff --exit-code -- generated/prisma
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run db:status
      - run: npm run db:smoke
      - run: npm run db:seed
      - name: Generate disposable test signing keys
        run: |
          npm run licensing:keys .certification-secrets
          {
            echo 'LICENSE_SIGNING_PRIVATE_KEY<<BKE_PRIVATE_KEY'
            cat .certification-secrets/license-signing-private.pem
            echo 'BKE_PRIVATE_KEY'
            echo 'LICENSE_SIGNING_PUBLIC_KEY<<BKE_PUBLIC_KEY'
            cat .certification-secrets/license-signing-public.pem
            echo 'BKE_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - run: npm run security:hygiene
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run deployment:verify-restart
      - run: npm run deployment:verify-manifest
      - run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - run: docker build --target runner -t bke-digital-solutions:ci .
