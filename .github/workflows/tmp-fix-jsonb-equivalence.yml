name: Temporary JSONB Equivalence Fix

on:
  push:
    branches:
      - feat/v2-webhooks-owner-adoption

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-webhooks-owner-adoption
          fetch-depth: 1
      - name: Canonicalize JSONB snapshot comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('v2/apps/web/payments/settlement-transaction.ts')
          source = path.read_text()
          old = '''function jsonEquivalent(left: unknown, right: unknown): boolean {\n  return JSON.stringify(left ?? null) === JSON.stringify(right ?? null);\n}\n'''
          new = '''function canonicalJson(value: unknown): unknown {\n  if (Array.isArray(value)) return value.map(canonicalJson);\n  if (value !== null && typeof value === "object") {\n    return Object.fromEntries(\n      Object.entries(value as Record<string, unknown>)\n        .sort(([leftKey], [rightKey]) => leftKey.localeCompare(rightKey))\n        .map(([key, nested]) => [key, canonicalJson(nested)]),\n    );\n  }\n  return value ?? null;\n}\n\nfunction jsonEquivalent(left: unknown, right: unknown): boolean {\n  return JSON.stringify(canonicalJson(left)) === JSON.stringify(canonicalJson(right));\n}\n'''
          if old not in source:
              raise SystemExit('expected jsonEquivalent block not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Remove helper and commit persistence adapter fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-jsonb-equivalence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/apps/web/payments/settlement-transaction.ts .github/workflows/tmp-fix-jsonb-equivalence.yml
          git diff --cached --check
          git commit -m 'fix(v2 entitlements): compare JSONB snapshots structurally'
          git push origin HEAD:feat/v2-webhooks-owner-adoption
