name: Entitlements Consumer Lock Bootstrap

on:
  push:
    branches: [feat/v2-entitlements-library-consumer]
    paths:
      - "package.json"
      - ".github/workflows/entitlements-consumer-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-entitlements-library-consumer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate deterministic application lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v2): lock @bke/entitlements consumer"
          git push origin HEAD:feat/v2-entitlements-library-consumer
