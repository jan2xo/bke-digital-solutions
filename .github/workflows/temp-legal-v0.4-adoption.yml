name: Temporary Legal 0.4 Adoption

on:
  push:
    branches: [tmp/v2-legal-constants-v0.4]
    paths:
      - ".github/workflows/temp-legal-v0.4-adoption.yml"

permissions:
  contents: write

jobs:
  adopt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v2-legal-constants-v0.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin released Legal 0.4.0 and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@bke/legal'] = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/legal-v0.4.0/bke-legal-0.4.0.tgz';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit exact npm adoption
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(v2): adopt released Legal 0.4.0"
          git push origin HEAD:tmp/v2-legal-constants-v0.4
