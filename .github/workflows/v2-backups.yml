name: BKE Backups - full recovery certification
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable candidate commit to prove
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bke-backups-certification-${{ inputs.source_sha }}
  cancel-in-progress: true
jobs:
  backups:
    name: Encrypted PostgreSQL + private objects + isolated recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DEPLOYMENT_ENV: test
      DEPLOYMENT_ID: bke-backup-certification
      DATABASE_URL: postgresql://bke:bke@127.0.0.1:5432/bke_test
      BACKUP_RESTORE_DATABASE_URL: postgresql://bke:bke@127.0.0.1:5432/bke_restore_backup
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-backup-session-secret-with-at-least-32-characters
      LICENSE_PEPPER: ci-backup-license-pepper-with-at-least-32-characters
      CRON_SECRET: ci-backup-cron-secret-with-at-least-32-characters
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: log
      EMAIL_FROM: ci-backup@example.com
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: bke-ci-minio
      S3_SECRET_ACCESS_KEY: bke-ci-minio-disposable-credential
      S3_BUCKET: bke-ci-source
      BACKUP_BUCKET: bke-ci-archive
      BACKUP_RESTORE_S3_BUCKET: bke-ci-restored
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Require exact immutable source
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - name: Start disposable private-object S3 provider
        run: |
          docker run -d --name bke-cert-minio --network host \
            -e MINIO_ROOT_USER=bke-ci-minio \
            -e MINIO_ROOT_PASSWORD=bke-ci-minio-disposable-credential \
            minio/minio:latest server /data --address ':9000'
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs bke-cert-minio | tail -30
          exit 1
      - name: Build real Node/pg_dump backup executor
        run: docker build --target backup-worker -t bke-backup-cert:${{ inputs.source_sha }} .
      - name: CERTIFY actual full archive and isolated restore
        run: |
          docker run --rm --network host \
            -e NODE_ENV -e DEPLOYMENT_ENV -e DEPLOYMENT_ID \
            -e DATABASE_URL -e BACKUP_RESTORE_DATABASE_URL -e APP_URL \
            -e SESSION_SECRET -e LICENSE_PEPPER -e CRON_SECRET \
            -e PAYMENT_PROVIDER -e EMAIL_PROVIDER -e EMAIL_FROM \
            -e S3_ENDPOINT -e S3_REGION -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY -e S3_BUCKET \
            -e BACKUP_BUCKET -e BACKUP_RESTORE_S3_BUCKET \
            bke-backup-cert:${{ inputs.source_sha }} npm run backups:certify-local
      - name: Verify no real credentials or production endpoints
        run: |
          test "$DEPLOYMENT_ENV" = test
          test "$PAYMENT_PROVIDER" = mock
          test "$NODE_ENV" = test
      - name: Clean disposable S3 process
        if: always()
        run: docker rm -f bke-cert-minio || true
