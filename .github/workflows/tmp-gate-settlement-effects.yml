name: Temporary Settlement Effect Gate

on:
  push:
    branches:
      - feat/v2-webhooks-owner-adoption

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-webhooks-owner-adoption
          fetch-depth: 1
      - name: Gate one-time host effects on created settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          settlement_path = Path('v2/apps/web/payments/settlement-transaction.ts')
          settlement = settlement_path.read_text()
          old = '''  return result.value;\n}\n'''
          new = '''  return Object.freeze({\n    ...result.value,\n    paymentSettlementDisposition: settlement.disposition,\n  });\n}\n'''
          if old not in settlement:
              raise SystemExit('settlement return block not found')
          settlement_path.write_text(settlement.replace(old, new, 1))

          webhook_path = Path('v2/apps/web/payments/webhook-processing.ts')
          webhook = webhook_path.read_text()
          old = '''  await fulfillOrderLicensing(\n    tx,\n    order.id,\n    { paymentId: payment.id, paymentEventId: event.eventId },\n    renewalRequests,\n  );\n  const account = await tx.customerAccount.findUniqueOrThrow({ where: { id: order.accountId } });\n  const invoice = await tx.invoice.findUniqueOrThrow({ where: { id: settlement.invoiceId } });\n  await queueCommerceEmail(tx, {\n    type: "PAYMENT_RECEIPT",\n    recipient: account.billingEmail,\n    subject: "BKE Digital Solutions payment receipt",\n    payload: { orderNumber: order.number },\n    deduplicationKey: `payment-receipt:${order.id}`,\n  });\n  await queueCommerceEmail(tx, {\n    type: "INVOICE_ISSUED",\n    recipient: account.billingEmail,\n    subject: "Your BKE Digital Solutions invoice",\n    payload: { orderNumber: order.number, invoiceNumber: invoice.number },\n    deduplicationKey: `invoice-issued:${order.id}`,\n  });\n  await queueCommerceEmail(tx, {\n    type: "LICENSE_ISSUED",\n    recipient: account.billingEmail,\n    subject: "Your BKE Digital Solutions license is ready",\n    payload: { orderNumber: order.number },\n    deduplicationKey: `entitlement-issued:${order.id}`,\n  });\n  await tx.auditLog.create({\n    data: {\n      accountId: order.accountId,\n      action: settlement.settlementDisposition === "AFTER_LOCAL_CANCELLATION"\n        ? "PAYMENT_SETTLED_AFTER_LOCAL_CANCELLATION"\n        : "PAYMENT_SETTLED",\n      targetType: "Order",\n      targetId: order.id,\n      metadata: { provider: event.provider, webhookEventId: event.eventId },\n    },\n  });\n'''
          new = '''  if (settlement.paymentSettlementDisposition === "CREATED") {\n    await fulfillOrderLicensing(\n      tx,\n      order.id,\n      { paymentId: payment.id, paymentEventId: event.eventId },\n      renewalRequests,\n    );\n    const account = await tx.customerAccount.findUniqueOrThrow({ where: { id: order.accountId } });\n    const invoice = await tx.invoice.findUniqueOrThrow({ where: { id: settlement.invoiceId } });\n    await queueCommerceEmail(tx, {\n      type: "PAYMENT_RECEIPT",\n      recipient: account.billingEmail,\n      subject: "BKE Digital Solutions payment receipt",\n      payload: { orderNumber: order.number },\n      deduplicationKey: `payment-receipt:${order.id}`,\n    });\n    await queueCommerceEmail(tx, {\n      type: "INVOICE_ISSUED",\n      recipient: account.billingEmail,\n      subject: "Your BKE Digital Solutions invoice",\n      payload: { orderNumber: order.number, invoiceNumber: invoice.number },\n      deduplicationKey: `invoice-issued:${order.id}`,\n    });\n    await queueCommerceEmail(tx, {\n      type: "LICENSE_ISSUED",\n      recipient: account.billingEmail,\n      subject: "Your BKE Digital Solutions license is ready",\n      payload: { orderNumber: order.number },\n      deduplicationKey: `entitlement-issued:${order.id}`,\n    });\n    await tx.auditLog.create({\n      data: {\n        accountId: order.accountId,\n        action: settlement.settlementDisposition === "AFTER_LOCAL_CANCELLATION"\n          ? "PAYMENT_SETTLED_AFTER_LOCAL_CANCELLATION"\n          : "PAYMENT_SETTLED",\n        targetType: "Order",\n        targetId: order.id,\n        metadata: { provider: event.provider, webhookEventId: event.eventId },\n      },\n    });\n  }\n'''
          if old not in webhook:
              raise SystemExit('paid host-effects block not found')
          webhook_path.write_text(webhook.replace(old, new, 1))
          PY
          git diff --check
      - name: Remove helper and commit settlement effect gate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-gate-settlement-effects.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/apps/web/payments/settlement-transaction.ts v2/apps/web/payments/webhook-processing.ts .github/workflows/tmp-gate-settlement-effects.yml
          git diff --cached --check
          git commit -m 'fix(v2 payments): gate one-time effects on new settlement'
          git push origin HEAD:feat/v2-webhooks-owner-adoption
