name: Prisma Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/spike-alpha/**"
      - "modules/spike-beta/**"
      - "platform/persistence/migration-compositor.mjs"
      - "tooling/certify-prisma-isolation.mjs"
      - ".github/workflows/v2-prisma-isolation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - alpha-only
          - beta-only
          - alpha-then-beta
          - beta-then-alpha
          - broken-alpha-locality
          - broken-beta-locality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_spike

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Certify module-owned Prisma isolation
        run: node tooling/certify-prisma-isolation.mjs "${{ matrix.scenario }}"
