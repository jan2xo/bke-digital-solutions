name: V2 Platform - Observability

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/platform/observability/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject V1/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|v2/modules|generated/prisma|from ["'"'"']@prisma/|process\.env)' v2/platform/observability --include='*.ts'; then
            echo "V2 Observability must receive publishers and alert persistence through ports."
            exit 1
          fi
      - name: Reject concrete publisher ownership
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(application|database|valkey|object_storage|scheduler|backups|payments|licensing|email|security|infrastructure)' v2/platform/observability --include='*.ts' --exclude='*.test.ts'; then
            echo "V2 Observability must aggregate publisher-owned health, not own domain cards."
            exit 1
          fi
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Certify Observability platform behavior
        run: npx vitest run --config v2/vitest.config.ts v2/platform/observability/test/observability.test.ts
