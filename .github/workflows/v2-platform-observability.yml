name: Platform - Observability

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  observability-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/|process\.env)' platform/observability --include='*.ts'; then
            echo "Observability must receive publishers and alert persistence through ports."
            exit 1
          fi
      - name: Reject concrete publisher ownership
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(application|database|valkey|object_storage|scheduler|backups|payments|licensing|email|security|infrastructure)' platform/observability --include='*.ts' --exclude='*.test.ts'; then
            echo "Observability must aggregate publisher-owned health, not own domain cards."
            exit 1
          fi
      - name: Reject legacy Observability implementation reach-through in web adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(@/lib/observability|generated/prisma|from ["'"'"']@prisma/)' apps/web/observability.ts; then
            echo "The web Observability adapter must not reach through legacy Observability or generated Prisma."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Observability platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/observability/test/observability.test.ts
