name: Temporary V2 Accounts 0.2 Commerce Wiring Bootstrap

on:
  push:
    branches:
      - feat/v2-accounts-0.2.0-adoption
    paths:
      - ".github/workflows/v2-accounts-0.2-commerce-wiring-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-accounts-0.2.0-adoption
          fetch-depth: 0
      - name: Wire Commerce to Accounts purchase-access capability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected ${label} marker`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one ${label} marker`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          let moduleSource = fs.readFileSync('v2/modules/commerce/module.ts', 'utf8');
          moduleSource = replaceOnce(
            moduleSource,
            'import {\n  ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID,\n  type AccountsAccountAccessCapability,\n} from "@bke/accounts/contracts/account-access.contract";',
            'import {\n  ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID,\n  type AccountsPurchaseAccessCapability,\n} from "@bke/accounts/contracts/purchase-access.contract";',
            'Accounts purchase-access import',
          );
          moduleSource = replaceOnce(
            moduleSource,
            '      ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID,\n      LEGAL_ACCEPTANCE_CAPABILITY_ID,',
            '      ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID,\n      LEGAL_ACCEPTANCE_CAPABILITY_ID,',
            'Commerce manifest Accounts dependency',
          );
          moduleSource = replaceOnce(
            moduleSource,
            '      const accountAccess = resolver.get<AccountsAccountAccessCapability>(\n        ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID,\n      );',
            '      const purchaseAccess = resolver.get<AccountsPurchaseAccessCapability>(\n        ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID,\n      );',
            'Commerce Accounts resolver',
          );
          moduleSource = replaceOnce(
            moduleSource,
            '          const result = await accountAccess.authorize({\n            principalId: input.principalId,\n            accountId: input.accountId,\n            requiredCapability: "PURCHASE",\n          });',
            '          const result = await purchaseAccess.authorize({\n            principalId: input.principalId,\n            accountId: input.accountId,\n          });',
            'Commerce account authorizer',
          );
          if (moduleSource.includes('@bke/accounts/contracts/account-access.contract')) {
            throw new Error('Commerce must not bypass Accounts purchase-access via generic account-access.');
          }
          if (moduleSource.includes('requiredCapability: "PURCHASE"')) {
            throw new Error('Commerce must delegate purchase policy to Accounts purchase-access.');
          }
          fs.writeFileSync('v2/modules/commerce/module.ts', moduleSource);

          let certSource = fs.readFileSync('v2/modules/commerce/test/consumer-adoption.certify.ts', 'utf8');
          certSource = replaceOnce(
            certSource,
            '  "@bke/commerce/contracts/",\n  "@bke/commerce/logic/",',
            '  "@bke/commerce/contracts/",\n  "@bke/accounts/contracts/purchase-access.contract",\n  "ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID",\n  "AccountsPurchaseAccessCapability",\n  "purchaseAccess",\n  "@bke/commerce/logic/",',
            'Commerce purchase-access certification markers',
          );
          certSource = replaceOnce(
            certSource,
            'for (const marker of [\n  \'"./contracts/\',',
            'for (const forbiddenAccountsBypass of [\n  "@bke/accounts/contracts/account-access.contract",\n  \'requiredCapability: "PURCHASE"\',\n]) {\n  if (moduleSource.includes(forbiddenAccountsBypass)) {\n    throw new Error(`Commerce host adapter bypasses Accounts purchase policy: ${forbiddenAccountsBypass}`);\n  }\n}\n\nfor (const marker of [\n  \'"./contracts/\',',
            'Commerce purchase-access bypass guard',
          );
          fs.writeFileSync('v2/modules/commerce/test/consumer-adoption.certify.ts', certSource);
          NODE

          rm .github/workflows/v2-accounts-0.2-commerce-wiring-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v2 commerce): delegate purchase lifecycle to Accounts"
          git push origin HEAD:feat/v2-accounts-0.2.0-adoption
