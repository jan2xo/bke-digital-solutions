name: V2 Identity Consumer Rewrite

on:
  push:
    branches: [feat/v2-identity-library-consumer]
    paths:
      - ".github/workflows/v2-identity-consumer-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-identity-library-consumer
          fetch-depth: 0

      - name: Rewrite Identity host adapter import roots only
        shell: python
        run: |
          from pathlib import Path

          path = Path('v2/modules/identity/module.ts')
          source = path.read_text()
          original_body = source[source.index('export interface IdentityModuleOptions'):]

          replacements = [
              ('from "./logic/providers/', 'from "@bke/identity/providers/'),
              ('from "./prisma/repositories/', 'from "@bke/identity/prisma/repositories/'),
              ('from "./contracts/', 'from "@bke/identity/contracts/'),
              ('from "./logic/', 'from "@bke/identity/logic/'),
              ('from "./module.manifest"', 'from "@bke/identity/module.manifest"'),
          ]

          counts = {}
          for old, new in replacements:
              count = source.count(old)
              counts[old] = count
              if count == 0:
                  raise SystemExit(f'Expected Identity host import prefix not found: {old}')
              source = source.replace(old, new)

          rewritten_body = source[source.index('export interface IdentityModuleOptions'):]
          if rewritten_body != original_body:
              raise SystemExit('Identity host adapter body changed; only imports may be rewritten.')

          forbidden = [
              'from "./contracts/',
              'from "./logic/',
              'from "./prisma/repositories/',
              'from "./module.manifest"',
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'Local Identity implementation import remains: {marker}')

          if 'from "../../contracts/capability"' not in source:
              raise SystemExit('Digital Solutions CapabilityModule host contract import must remain local.')

          path.write_text(source)
          print('Identity host adapter import rewrite GREEN')
          for marker, count in counts.items():
              print(f'{marker} -> {count}')

      - name: Commit host adapter consumer switch
        shell: bash
        run: |
          set -euo pipefail
          git add v2/modules/identity/module.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(identity): consume standalone library"
          git push origin HEAD:feat/v2-identity-library-consumer
