name: Temporary V2 Audit Import Migration

on:
  push:
    branches: [feat/v2-host-standalone-convergence]
    paths:
      - ".github/workflows/tmp-v2-audit-import-migration.yml"

permissions:
  contents: write

jobs:
  migrate-audit-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-standalone-convergence
          fetch-depth: 0
      - name: Replace only legacy Audit imports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['app', 'components', 'v2/apps', 'tests'];
          const from = '@/lib/audit';
          const to = '@/v2/apps/web/audit';
          let changed = 0;
          function walk(target) {
            if (!fs.existsSync(target)) return;
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              for (const name of fs.readdirSync(target)) walk(path.join(target, name));
              return;
            }
            if (!/\.(ts|tsx)$/.test(target)) return;
            const original = fs.readFileSync(target, 'utf8');
            const next = original.split(from).join(to);
            if (next !== original) {
              fs.writeFileSync(target, next);
              changed++;
              console.log(target);
            }
          }
          roots.forEach(walk);
          console.log(`changed=${changed}`);
          if (!changed) process.exitCode = 2;
          NODE
      - name: Commit mechanical import migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components v2/apps tests
          git diff --cached --check
          git commit -m "refactor(v2 host): route audit calls through V2 adapter"
          git push origin HEAD:feat/v2-host-standalone-convergence
