name: Payments Consumer Lock Bootstrap

on:
  push:
    branches: [feat/v2-payments-library-consumer]
    paths:
      - ".github/workflows/payments-consumer-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-payments-library-consumer
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit Payments consumer lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore(v2 payments): lock @bke/payments consumer"
          git push origin HEAD:feat/v2-payments-library-consumer
