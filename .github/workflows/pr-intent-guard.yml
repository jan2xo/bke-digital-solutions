name: PR Intent Guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-intent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intent-guard:
    name: Certification intent declared
    runs-on: ubuntu-latest
    steps:
      - name: Validate durable certification plan
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull) {
              core.setFailed("PR Intent Guard requires a pull_request event.");
              return;
            }

            if (pull.draft) {
              await core.summary
                .addHeading("Draft PR")
                .addRaw("Certification intent may continue evolving while the PR is draft.\n")
                .write();
              return;
            }

            const body = pull.body ?? "";
            if (!/certification plan/i.test(body)) {
              core.setFailed(
                "Ready PRs must record a durable Certification plan in the PR body before merge.",
              );
              return;
            }
            if (!/production/i.test(body)) {
              core.setFailed(
                "Ready PRs must record the production/preproduction state in the PR body.",
              );
              return;
            }

            await core.summary
              .addHeading("Certification intent recorded")
              .addRaw("PR #" + pull.number + " head: " + pull.head.sha + "\n")
              .write();
