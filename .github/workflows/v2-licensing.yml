name: V2 Module - Licensing

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/licensing/**"
      - "app/api/licenses/refresh/route.ts"
      - "tests/unit/refresh-decision.test.ts"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-licensing.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Licensing package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-licensing-0.2.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/licensing-v0.2.0/bke-licensing-0.2.0.tgz
          echo "532761d887568fa4ca9767dbcbb17513e8408d6713d0bfc9f7c4feb97561131f  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Licensing standalone consumer adoption and staging retirement
        run: npx tsx v2/modules/licensing/test/consumer-adoption.certify.ts
      - name: Certify released refresh decision parity
        run: npx vitest run tests/unit/refresh-decision.test.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate installed Licensing Prisma schema
        run: npx prisma validate --schema node_modules/@bke/licensing/prisma/schema.prisma
      - name: Apply installed Licensing baseline
        run: node v2/platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
      - name: Prove installed Licensing migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
