name: Module - Licensing

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: licensing-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  licensing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_licensing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Licensing package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-licensing-0.10.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/licensing-v0.10.0/bke-licensing-0.10.0.tgz
          echo "4d2f8e4295effcfd4aa3b6492944e8dbba3ec75e86c83727a30daa74e4f75d60  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Licensing standalone consumer adoption and staging retirement
        run: npx tsx modules/licensing/test/consumer-adoption.certify.ts
      - name: Certify dual account/license-key activation policy and legacy signed contract
        run: npx vitest run tests/licensing-dual-activation-mode.test.ts tests/licensing-contract.test.ts
      - name: Certify authentic Agent signed issuance, signer key mismatch/rotation and HTTP denial
        run: npx vitest run tests/agent-session-account-product-lease-issuance.test.ts tests/agent-session-account-product-lease-signer.test.ts tests/agent-session-account-product-lease-http.test.ts tests/agent-standalone-startup-policy-issuance.test.ts
      - name: Certify immutable Licensing 0.10 JWS against DS prepared claims (test keys only)
        run: npx vitest run tests/agent-session-licensing-v010-consumer.test.ts
      - name: Certify released refresh decision parity
        run: npx vitest run tests/unit/refresh-decision.test.ts
      - name: Certify license seat management boundaries
        run: npx vitest run tests/license-seat-management.test.ts tests/v3-agent-software-catalog-contract.test.ts
      - name: Certify account-session product update authority
        run: npx vitest run tests/agent-session-update-authority.test.ts
      - name: Certify account-session product repair authority
        run: npx vitest run tests/agent-session-repair-authority.test.ts
      - name: Export current signed Agent self-update cross-repo fixture
        run: |
          npx tsx scripts/certify-licensing-agent-signed-update.ts /tmp/bke-agent-update-fixture.json
          test -s /tmp/bke-agent-update-fixture.json
          node -e 'const f=require("/tmp/bke-agent-update-fixture.json"); if(f.schema!=="bke.agent-self-update-cross-repo-fixture.v1"||f.source!=="bke-digital-solutions"||f.fixtures.length!==2) process.exit(1)'

      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate installed Licensing Prisma schema
        run: npx prisma validate --schema node_modules/@bke/licensing/prisma/schema.prisma
      - name: Apply installed Licensing baseline
        run: node platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
      - name: Prove installed Licensing migration idempotence
        run: node platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
