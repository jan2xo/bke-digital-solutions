name: V2 Module - Licensing

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/licensing/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-licensing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate Licensing Prisma schema
        run: npx prisma validate --schema v2/modules/licensing/prisma/schema.prisma
      - name: Apply Licensing baseline
        run: node v2/platform/persistence/migration-compositor.mjs licensing
      - name: Prove Licensing migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs licensing
      - name: Certify Licensing persistence isolation
        run: npx tsx v2/modules/licensing/test/persistence-isolation.certify.ts
      - name: Test Licensing license key reveal
        run: npx vitest run --config v2/vitest.config.ts v2/modules/licensing/test/license-key-reveal.test.ts
      - name: Certify Licensing license key reveal with PostgreSQL
        run: npx tsx v2/modules/licensing/test/license-key-reveal.postgres.certify.ts
      - name: Test Licensing module composition
        run: npx vitest run --config v2/vitest.config.ts v2/modules/licensing/test/module-composition.test.ts
