name: Module - Licensing

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/licensing/**"
      - "app/api/licenses/refresh/route.ts"
      - "app/api/licenses/[id]/assignments/**"
      - "app/dashboard/accounts/[accountId]/licenses/[licenseId]/seats/**"
      - "apps/web/licensing/license-seat-management.ts"
      - "apps/web/catalog/agent-software-catalog.ts"
      - "app/api/agent-sessions/catalog/route.ts"
      - "app/api/agent-sessions/provision/standalone/route.ts"
      - "app/api/agent-sessions/update/standalone/route.ts"
      - "apps/web/agent-sessions/update-policy.ts"
      - "tests/agent-session-update-authority.test.ts"
      - "components/license-seat-manager.tsx"
      - "components/customer-license-card.tsx"
      - "tests/license-seat-management.test.ts"
      - "tests/v3-agent-software-catalog-contract.test.ts"
      - "tests/unit/refresh-decision.test.ts"
      - "platform/persistence/migration-compositor.mjs"
      - "contracts/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - ".github/workflows/v2-licensing.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Licensing package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-licensing-0.9.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/licensing-v0.9.0/bke-licensing-0.9.0.tgz
          echo "afb66b9c2c7ae514b3a9afcc7b6eeccbb697e1a6f361cd85fc765b356b978e89  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Licensing standalone consumer adoption and staging retirement
        run: npx tsx modules/licensing/test/consumer-adoption.certify.ts
      - name: Certify released refresh decision parity
        run: npx vitest run tests/unit/refresh-decision.test.ts
      - name: Certify license seat management boundaries
        run: npx vitest run tests/license-seat-management.test.ts tests/v3-agent-software-catalog-contract.test.ts
      - name: Certify account-session product update authority
        run: npx vitest run tests/agent-session-update-authority.test.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate installed Licensing Prisma schema
        run: npx prisma validate --schema node_modules/@bke/licensing/prisma/schema.prisma
      - name: Apply installed Licensing baseline
        run: node platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
      - name: Prove installed Licensing migration idempotence
        run: node platform/persistence/migration-compositor.mjs licensing node_modules/@bke/licensing/migrations
