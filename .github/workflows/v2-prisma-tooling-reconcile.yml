name: V2 Prisma Tooling Reconcile

on:
  pull_request:
    branches: [feat/v2-privacy-catalog-frontier-retirement]
    paths:
      - ".github/workflows/v2-prisma-tooling-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rewire non-production Prisma tooling imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = 'v2/platform/host/generated/prisma'
          new = 'v2/platform/persistence/generated/prisma'
          roots = [Path('scripts'), Path('prisma/seed.ts')]
          changed = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.ts', '.tsx', '.js', '.mjs'}]
              for path in paths:
                  text = path.read_text()
                  if old in text:
                      path.write_text(text.replace(old, new))
                      changed.append(str(path))
          print('rewired:', *changed, sep='\n  ')
          leftovers = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.ts', '.tsx', '.js', '.mjs'}]
              for path in paths:
                  if old in path.read_text(): leftovers.append(str(path))
          if leftovers:
              raise SystemExit('stale tooling Prisma paths remain: ' + ', '.join(leftovers))
          PY
      - name: Commit tooling path reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts prisma/seed.ts
          if git diff --cached --quiet; then
            echo "Tooling paths already reconciled."
            exit 0
          fi
          git commit -m "fix(v2 persistence): rewire Prisma tooling imports"
          git push origin "HEAD:${{ github.head_ref }}"
