name: Production Host - Legacy Free

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "apps/**"
      - "components/**"
      - "contracts/**"
      - "lib/**"
      - "modules/**"
      - "platform/**"
      - "prisma/**"
      - "tooling/**"
      - "generated/prisma/**"
      - "middleware.ts"
      - "middleware.tsx"
      - "proxy.ts"
      - "instrumentation.ts"
      - "instrumentation-client.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/v2-host-v1-free.yml"
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  host-v1-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Certify production host has zero legacy runtime reach-through
        run: node tooling/check-host-v1-dependencies.mjs
