name: Protected PayMongo TEST-mode probe

# Not a production deployment. No push/PR triggers and no credentials in normal CI.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to test; no branch or PR secrets
        type: string
        required: true
      create_test_checkout:
        description: Create one provider-hosted synthetic TEST checkout (no charge)
        type: boolean
        default: false
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: protected-paymongo-test-probe
  cancel-in-progress: false

jobs:
  gate:
    name: Verify explicit owner TEST-only intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 316 &&
       github.event.comment.body == '/probe-paymongo-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exact_sha: ${{ steps.validate.outputs.exact_sha }}
      run_checkout: ${{ steps.validate.outputs.run_checkout }}
    steps:
      - name: Require exact current main and repository owner
        id: validate
        uses: actions/github-script@v7
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_CHECKOUT: ${{ inputs.create_test_checkout }}
        with:
          script: |
            const owner = context.repo.owner;
            if (context.actor !== owner) {
              core.setFailed("PAYMONGO_TEST_REPOSITORY_OWNER_REQUIRED"); return;
            }
            if (context.eventName === "issue_comment") {
              if (context.issue.number !== 316 ||
                  context.payload.comment?.body !== "/probe-paymongo-test") {
                core.setFailed("PAYMONGO_TEST_EXPLICIT_COMMAND_REQUIRED"); return;
              }
            }
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: "main",
            });
            const sha = main.data.commit.sha;
            if (context.ref !== "refs/heads/main" ||
                context.sha !== sha ||
                (context.eventName === "workflow_dispatch" && process.env.INPUT_SOURCE_SHA !== sha)) {
              core.setFailed("PAYMONGO_TEST_EXACT_CURRENT_MAIN_REQUIRED"); return;
            }
            core.setOutput("exact_sha", sha);
            core.setOutput("run_checkout",
              context.eventName === "issue_comment" || process.env.INPUT_CHECKOUT === "true" ? "true" : "false");
            core.info("PASS: exact current main, owner command and protected TEST-only scope.");

  test:
    name: Test-only Infisical OIDC and PayMongo sandbox
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.exact_sha }}
          persist-credentials: false
      - name: Verify immutable source and Test-only environment variables
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.exact_sha }}
          INFISICAL_IDENTITY: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          INFISICAL_PROJECT: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$INFISICAL_IDENTITY" || { echo "PAYMONGO_TEST_INFISICAL_IDENTITY_NOT_CONFIGURED"; exit 1; }
          test -n "$INFISICAL_PROJECT" || { echo "PAYMONGO_TEST_INFISICAL_PROJECT_NOT_CONFIGURED"; exit 1; }
      # Do NOT use Infisical/secrets-action: it bulk-exports prod keys.
      # This protected script reads precisely TWO named TEST secrets via API,
      # never sets GITHUB_ENV, and passes only TEST values in memory.
      - name: Probe PayMongo with only named TEST credentials
        shell: bash
        env:
          INFISICAL_PRODUCTION_IDENTITY_ID: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          INFISICAL_PRODUCTION_PROJECT_ID: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
          RUN_CHECKOUT: ${{ needs.gate.outputs.run_checkout }}
        run: |
          set -euo pipefail
          node --test scripts/probe-paymongo-test.test.mjs
          if [ "$RUN_CHECKOUT" = "true" ]; then
            node scripts/probe-paymongo-infisical.mjs --checkout
          else
            node scripts/probe-paymongo-infisical.mjs
          fi
