name: Temporary V2 Final Frontier Scan

on:
  push:
    branches:
      - feat/v2-host-infrastructure-finalization

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-infrastructure-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unchanged production-host V1 scanner
        shell: bash
        run: |
          set +e
          node v2/tooling/check-host-v1-dependencies.mjs
          code=$?
          set -e
          rm .github/workflows/temp-v2-final-frontier-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v2 host): remove temporary frontier scanner"
          git push origin HEAD:feat/v2-host-infrastructure-finalization
          exit "$code"
