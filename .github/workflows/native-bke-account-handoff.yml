name: Native BKE Account Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/agent-sessions/native/**"
      - "app/api/agent-sessions/device/token/**"
      - "apps/web/agent-sessions/**"
      - "apps/web/accounts/agent-device-session-authorization.ts"
      - "prisma/migrations/**"
      - "tests/native-bke-account-handoff.test.ts"
      - ".github/workflows/native-bke-account-handoff.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_native_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_native_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_native_auth
      DIRECT_DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_native_auth
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Certify native handoff schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT "authorizationKind", count(*)
          FROM "AgentDeviceAuthorization"
          GROUP BY "authorizationKind";
          SELECT conname
          FROM pg_constraint
          WHERE conname = 'AgentDeviceAuthorization_authorizationKind_check';
          SQL
      - name: Certify native BKE handoff boundaries
        run: npx vitest run tests/native-bke-account-handoff.test.ts
      - name: Typecheck host
        run: npm run typecheck
