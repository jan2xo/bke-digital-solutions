name: Temporary V2 Auth Certification

on:
  push:
    branches:
      - feat/v2-host-infrastructure-finalization

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
      PAYMENT_PROVIDER: mock
      EMAIL_FROM: test@example.com
      S3_BUCKET: test
      CRON_SECRET: ci-cron-secret-with-at-least-32-chars
      LICENSE_SIGNING_KEY_ID: ci-license-signing-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-infrastructure-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck Identity-backed host auth
        run: npm run typecheck
      - name: Run unchanged production-host V1 scanner
        shell: bash
        run: |
          set +e
          node v2/tooling/check-host-v1-dependencies.mjs
          code=$?
          set -e
          echo "SCANNER_EXIT=$code"
      - name: Remove temporary certification workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/temp-v2-auth-certification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v2 auth): remove temporary auth certification"
          git push origin HEAD:feat/v2-host-infrastructure-finalization
