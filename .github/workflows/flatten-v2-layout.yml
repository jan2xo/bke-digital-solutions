name: Flatten V2 repository layout

on:
  push:
    branches: [refactor/flatten-v2-layout]
    paths:
      - ".github/workflows/flatten-v2-layout.yml"

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/flatten-v2-layout
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Flatten source architecture into repository root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apps
          git mv v2/apps/orchestrator apps/orchestrator
          git mv v2/apps/standalone apps/standalone
          git mv v2/apps/web apps/web
          git mv v2/contracts contracts
          git mv v2/modules modules
          git mv v2/platform platform
          git mv v2/tooling tooling
          git mv v2/tsconfig.json tsconfig.architecture.json
          git mv v2/vitest.config.ts vitest.architecture.config.ts
          git rm v2/README.md
          find v2 -depth -type d -empty -delete
          test ! -d v2

          python <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          replacements = [
              ("@/v2/", "@/"),
              ("v2/apps/", "apps/"),
              ("v2/contracts/", "contracts/"),
              ("v2/modules/", "modules/"),
              ("v2/platform/", "platform/"),
              ("v2/tooling/", "tooling/"),
              ("v2/tsconfig.json", "tsconfig.architecture.json"),
              ("v2/vitest.config.ts", "vitest.architecture.config.ts"),
          ]

          for name in tracked:
              if not name or name.startswith('.github/workflows/'):
                  continue
              p = Path(name)
              if not p.exists() or p.is_dir():
                  continue
              try:
                  data = p.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              new = data
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != data:
                  p.write_text(new)

          Path("tsconfig.architecture.json").write_text('''{
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "incremental": false,
              "plugins": []
            },
            "include": [
              "apps/**/*.ts",
              "apps/**/*.tsx",
              "contracts/**/*.ts",
              "contracts/**/*.tsx",
              "modules/**/*.ts",
              "modules/**/*.tsx",
              "platform/**/*.ts",
              "platform/**/*.tsx",
              "tooling/**/*.ts",
              "tooling/**/*.tsx"
            ],
            "exclude": ["node_modules"]
          }
          ''')

          Path("vitest.architecture.config.ts").write_text('''import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              environment: "node",
              include: [
                "apps/**/*.test.ts",
                "contracts/**/*.test.ts",
                "modules/**/*.test.ts",
                "platform/**/*.test.ts",
                "tooling/**/*.test.ts",
              ],
              fileParallelism: false,
            },
          });
          ''')
          PY

          test ! -d v2

          if git grep -n '@/v2/' -- ':!package-lock.json' ':!.github/workflows/**'; then
            echo 'stale @/v2 source import remains' >&2
            exit 1
          fi

          if git grep -nE 'v2/(apps|contracts|modules|platform|tooling)/' -- ':!.github/workflows/**' ':!docs/**' ':!CHANGELOG.md' ':!ROADMAP.md' ':!TRUTHCHECK.md'; then
            echo 'stale active source path remains' >&2
            exit 1
          fi

          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck repository
        run: npm run typecheck

      - name: Typecheck architecture root
        run: npx tsc -p tsconfig.architecture.json --noEmit

      - name: Commit flattened source layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jan2xo"
          git config user.email "163499503+jan2xo@users.noreply.github.com"
          git add -A -- ':!.github/workflows/**'
          git commit -m "refactor: make V2 source the repository root"
          git push origin HEAD:refactor/flatten-v2-layout
