name: V2 Module - Accounts

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/accounts/**"
      - "v2/modules/identity/test/consumer-adoption.certify.ts"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-accounts.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_accounts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_accounts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Accounts package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-accounts-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.1.0/bke-accounts-0.1.0.tgz
          echo "3837547a2d5d5084616d848b9b1a4674cc24a73a1b8285155e148808cdbdd511  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Accounts standalone consumer adoption
        run: npx tsx v2/modules/accounts/test/consumer-adoption.certify.ts
      - name: Certify Accounts staging extraction boundary
        run: npx tsx v2/modules/accounts/test/extraction.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate installed Accounts Prisma schema
        run: npx prisma validate --schema node_modules/@bke/accounts/prisma/schema.prisma
      - name: Apply installed Accounts baseline
        run: node v2/platform/persistence/migration-compositor.mjs accounts node_modules/@bke/accounts/migrations
      - name: Prove installed Accounts migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs accounts node_modules/@bke/accounts/migrations
      - name: Certify Accounts persistence isolation
        run: npx tsx v2/modules/accounts/test/persistence-isolation.certify.ts
      - name: Test Accounts individual account creation
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/individual-account-creation.test.ts
      - name: Certify Accounts individual account creation with PostgreSQL
        run: npx tsx v2/modules/accounts/test/individual-account-creation.postgres.certify.ts
      - name: Test Accounts account access
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/account-access.test.ts
      - name: Certify Accounts account access with PostgreSQL
        run: npx tsx v2/modules/accounts/test/account-access.postgres.certify.ts
      - name: Test Accounts switchable account list
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/switchable-account-list.test.ts
      - name: Certify Accounts switchable account list with PostgreSQL
        run: npx tsx v2/modules/accounts/test/switchable-account-list.postgres.certify.ts
      - name: Test Accounts organization account creation
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/organization-account-creation.test.ts
      - name: Certify Accounts organization account creation with PostgreSQL
        run: npx tsx v2/modules/accounts/test/organization-account-creation.postgres.certify.ts
      - name: Test Accounts organization profile update
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/organization-profile-update.test.ts
      - name: Certify Accounts organization profile update with PostgreSQL
        run: npx tsx v2/modules/accounts/test/organization-profile-update.postgres.certify.ts
      - name: Test Accounts organization close
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/organization-close.test.ts
      - name: Certify Accounts organization close with PostgreSQL
        run: npx tsx v2/modules/accounts/test/organization-close.postgres.certify.ts
      - name: Test Accounts organization detail
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/organization-detail.test.ts
      - name: Certify Accounts organization detail with PostgreSQL
        run: npx tsx v2/modules/accounts/test/organization-detail.postgres.certify.ts
      - name: Test Accounts invitation issuance
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-issuance.test.ts
      - name: Certify Accounts invitation issuance with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-issuance.postgres.certify.ts
      - name: Test Accounts invitation list
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-list.test.ts
      - name: Certify Accounts invitation list with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-list.postgres.certify.ts
      - name: Test Accounts invitation resend
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-resend.test.ts
      - name: Certify Accounts invitation resend with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-resend.postgres.certify.ts
      - name: Test Accounts invitation revocation
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-revocation.test.ts
      - name: Certify Accounts invitation revocation with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-revocation.postgres.certify.ts
      - name: Test Accounts invitation expiration
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-expiration.test.ts
      - name: Certify Accounts invitation expiration with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-expiration.postgres.certify.ts
      - name: Test Accounts invitation acceptance
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/invitation-acceptance.test.ts
      - name: Certify Accounts invitation acceptance with PostgreSQL
        run: npx tsx v2/modules/accounts/test/invitation-acceptance.postgres.certify.ts
      - name: Test Accounts membership role change
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/membership-role-change.test.ts
      - name: Certify Accounts membership role change with PostgreSQL
        run: npx tsx v2/modules/accounts/test/membership-role-change.postgres.certify.ts
      - name: Test Accounts membership removal
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/membership-removal.test.ts
      - name: Certify Accounts membership removal with PostgreSQL
        run: npx tsx v2/modules/accounts/test/membership-removal.postgres.certify.ts
      - name: Test Accounts member leave
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/member-leave.test.ts
      - name: Certify Accounts member leave with PostgreSQL
        run: npx tsx v2/modules/accounts/test/member-leave.postgres.certify.ts
      - name: Test Accounts ownership transfer
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/ownership-transfer.test.ts
      - name: Certify Accounts ownership transfer with PostgreSQL
        run: npx tsx v2/modules/accounts/test/ownership-transfer.postgres.certify.ts
      - name: Test Accounts host module composition
        run: npx vitest run --config v2/vitest.config.ts v2/modules/accounts/test/module-composition.test.ts
