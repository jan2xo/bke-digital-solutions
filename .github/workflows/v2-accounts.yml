name: Module - Accounts

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/accounts/**"
      - "app/api/agent-sessions/store/checkout-review/route.ts"
      - "tests/agent-session-checkout-review.test.ts"
      - "app/api/agent-sessions/store/checkout-start/route.ts"
      - "tests/agent-session-checkout-start.test.ts"
      - "platform/persistence/migration-compositor.mjs"
      - "contracts/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - ".github/workflows/v2-accounts.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_accounts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_accounts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Accounts package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-accounts-0.4.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.4.0/bke-accounts-0.4.0.tgz
          echo "59503141f2b7bbbe561db643b1df090907844781b9cf8464ee5e1569a425ae98  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Accounts standalone consumer adoption
        run: npx tsx modules/accounts/test/consumer-adoption.certify.ts
      - name: Certify Agent Store checkout review boundary
        run: npx vitest run tests/agent-session-checkout-review.test.ts
      - name: Certify Agent Store checkout start boundary
        run: npx vitest run tests/agent-session-checkout-start.test.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate installed Accounts Prisma schema
        run: npx prisma validate --schema node_modules/@bke/accounts/prisma/schema.prisma
      - name: Apply installed Accounts baseline
        run: node platform/persistence/migration-compositor.mjs accounts node_modules/@bke/accounts/migrations
      - name: Prove installed Accounts migration idempotence
        run: node platform/persistence/migration-compositor.mjs accounts node_modules/@bke/accounts/migrations
