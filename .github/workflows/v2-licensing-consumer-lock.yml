name: V2 Licensing Consumer Lock Refresh

on:
  push:
    branches: [feat/v2-licensing-library-consumer]
    paths:
      - ".github/workflows/v2-licensing-consumer-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-licensing-library-consumer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lock from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit npm-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(v2 licensing): refresh package lock"
          git push origin HEAD:feat/v2-licensing-library-consumer
