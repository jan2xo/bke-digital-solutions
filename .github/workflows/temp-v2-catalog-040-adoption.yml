name: Temporary V2 Catalog 0.4.0 Adoption

on:
  push:
    branches:
      - feat/v2-host-infrastructure-finalization

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-host-infrastructure-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Adopt immutable Catalog 0.4.0 artifact and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          text=p.read_text()
          old='https://github.com/jan2xo/bke-libraries-typescript/releases/download/catalog-v0.3.0/bke-catalog-0.3.0.tgz'
          new='https://github.com/jan2xo/bke-libraries-typescript/releases/download/catalog-v0.4.0/bke-catalog-0.4.0.tgz'
          if old not in text:
              raise SystemExit('expected Catalog 0.3.0 pin not found')
          p.write_text(text.replace(old,new))
          PY
          npm install --package-lock-only --ignore-scripts
          rm .github/workflows/temp-v2-catalog-040-adoption.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/temp-v2-catalog-040-adoption.yml
          git diff --cached --check
          git commit -m "build(v2 catalog): adopt catalog 0.4.0"
          git pull --rebase origin feat/v2-host-infrastructure-finalization
          git push origin HEAD:feat/v2-host-infrastructure-finalization
