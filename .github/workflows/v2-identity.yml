name: V2 Module - Identity

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/identity/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - ".github/workflows/v2-identity.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Identity package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-identity-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.1.0/bke-identity-0.1.0.tgz
          echo "4d77587762405e5844fe2a4ad38d16c1bea62ac06ac260696f1c2f3cc1b2cb8d  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Identity extraction boundary
        run: npx tsx v2/modules/identity/test/extraction.certify.ts
      - name: Certify Identity standalone consumer adoption
        run: npx tsx v2/modules/identity/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate Identity Prisma schema
        run: npx prisma validate --config v2/modules/identity/prisma.config.ts
      - name: Apply Identity baseline
        run: node v2/platform/persistence/migration-compositor.mjs identity
      - name: Prove Identity migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs identity
      - name: Test Identity logic
        run: >-
          npx vitest run --config v2/vitest.config.ts
          v2/modules/identity/test/identity-service.test.ts
          v2/modules/identity/test/password-authentication.test.ts
          v2/modules/identity/test/password-change.test.ts
          v2/modules/identity/test/email-verification-issuance.test.ts
          v2/modules/identity/test/email-verification-completion.test.ts
          v2/modules/identity/test/magic-login-request.test.ts
          v2/modules/identity/test/magic-login-consume.test.ts
          v2/modules/identity/test/session-issuance.test.ts
          v2/modules/identity/test/session-validation.test.ts
          v2/modules/identity/test/session-termination.test.ts
          v2/modules/identity/test/login-mfa-verification.test.ts
          v2/modules/identity/test/login-mfa-challenge-issuance.test.ts
          v2/modules/identity/test/mfa-enrollment-start.test.ts
          v2/modules/identity/test/mfa-enrollment-completion.test.ts
          v2/modules/identity/test/mfa-disable.test.ts
          v2/modules/identity/test/mfa-recovery-regeneration.test.ts
          v2/modules/identity/test/mfa-emergency-enrollment.test.ts
          v2/modules/identity/test/recent-auth-challenge-issuance.test.ts
          v2/modules/identity/test/recent-auth-completion.test.ts
          v2/modules/identity/test/password-reset-request.test.ts
          v2/modules/identity/test/password-reset-completion.test.ts
      - name: Certify Identity persistence
        run: npx tsx v2/modules/identity/test/persistence.certify.ts
      - name: Certify Identity password authentication
        run: npx tsx v2/modules/identity/test/password-authentication.certify.ts
      - name: Certify Identity password change
        run: npx tsx v2/modules/identity/test/password-change.certify.ts
      - name: Certify Identity email verification issuance
        run: npx tsx v2/modules/identity/test/email-verification-issuance.certify.ts
      - name: Certify Identity email verification completion
        run: npx tsx v2/modules/identity/test/email-verification-completion.certify.ts
      - name: Certify Identity magic-login request
        run: npx tsx v2/modules/identity/test/magic-login-request.certify.ts
      - name: Certify Identity magic-login consume
        run: npx tsx v2/modules/identity/test/magic-login-consume.certify.ts
      - name: Certify Identity session issuance
        run: npx tsx v2/modules/identity/test/session-issuance.certify.ts
      - name: Certify Identity session validation
        run: npx tsx v2/modules/identity/test/session-validation.certify.ts
      - name: Certify Identity session termination
        run: npx tsx v2/modules/identity/test/session-termination.certify.ts
      - name: Certify Identity login MFA verification
        run: npx tsx v2/modules/identity/test/login-mfa-verification.certify.ts
      - name: Certify Identity login MFA challenge issuance
        run: npx tsx v2/modules/identity/test/login-mfa-challenge-issuance.certify.ts
      - name: Certify Identity MFA enrollment start
        run: npx tsx v2/modules/identity/test/mfa-enrollment-start.certify.ts
      - name: Certify Identity MFA enrollment completion
        run: npx tsx v2/modules/identity/test/mfa-enrollment-completion.certify.ts
      - name: Certify Identity MFA disable
        run: npx tsx v2/modules/identity/test/mfa-disable.certify.ts
      - name: Certify Identity MFA recovery regeneration
        run: npx tsx v2/modules/identity/test/mfa-recovery-regeneration.certify.ts
      - name: Certify Identity emergency MFA enrollment
        run: npx tsx v2/modules/identity/test/mfa-emergency-enrollment.certify.ts
      - name: Certify Identity recent-auth challenge issuance
        run: npx tsx v2/modules/identity/test/recent-auth-challenge-issuance.certify.ts
      - name: Certify Identity recent-auth completion
        run: npx tsx v2/modules/identity/test/recent-auth-completion.certify.ts
      - name: Certify Identity password-reset request
        run: npx tsx v2/modules/identity/test/password-reset-request.certify.ts
      - name: Certify Identity password-reset completion
        run: npx tsx v2/modules/identity/test/password-reset-completion.certify.ts
