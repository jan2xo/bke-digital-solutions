name: Module - Identity

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: identity-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_identity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Identity package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-identity-0.5.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.5.0/bke-identity-0.5.0.tgz
          echo "d78e365d2db23044fe1175114affb540823599380c5dda85042dfe8073e1a2b9  $artifact" | sha256sum -c -
      - name: Verify reviewed oauth4webapi artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/oauth4webapi-3.8.8.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/panva/oauth4webapi/releases/download/v3.8.8/oauth4webapi-3.8.8.tgz
          echo "bac088aecc7cc80e2469b08592c8eb01b9ae6d4a749d89a6016aa54bb1533690  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Identity standalone consumer adoption
        run: npx tsx modules/identity/test/consumer-adoption.certify.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate installed Identity Prisma schema
        run: npx prisma validate --schema node_modules/@bke/identity/prisma/schema.prisma
      - name: Apply installed Identity baseline
        run: node platform/persistence/migration-compositor.mjs identity node_modules/@bke/identity/migrations
      - name: Prove installed Identity migration idempotence
        run: node platform/persistence/migration-compositor.mjs identity node_modules/@bke/identity/migrations
