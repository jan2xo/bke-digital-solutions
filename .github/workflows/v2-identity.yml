name: Module - Identity

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/identity/**"
      - "app/api/agent-sessions/store/checkout-review/route.ts"
      - "tests/agent-session-checkout-review.test.ts"
      - "app/api/agent-sessions/store/checkout-start/route.ts"
      - "tests/agent-session-checkout-start.test.ts"
      - "platform/persistence/migration-compositor.mjs"
      - "contracts/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - ".github/workflows/v2-identity.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Identity package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-identity-0.3.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.3.0/bke-identity-0.3.0.tgz
          echo "5d8820122de15e0b500f6e3cccfdeeec6b63afbb361daa1dee3fc217e1c3f139  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Identity standalone consumer adoption
        run: npx tsx modules/identity/test/consumer-adoption.certify.ts
      - name: Certify Agent Store checkout review boundary
        run: npx vitest run tests/agent-session-checkout-review.test.ts
      - name: Certify Agent Store checkout start boundary
        run: npx vitest run tests/agent-session-checkout-start.test.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate installed Identity Prisma schema
        run: npx prisma validate --schema node_modules/@bke/identity/prisma/schema.prisma
      - name: Apply installed Identity baseline
        run: node platform/persistence/migration-compositor.mjs identity node_modules/@bke/identity/migrations
      - name: Prove installed Identity migration idempotence
        run: node platform/persistence/migration-compositor.mjs identity node_modules/@bke/identity/migrations
