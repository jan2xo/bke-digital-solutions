name: V2 Module - Catalog

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/catalog/**"
      - "v2/apps/standalone/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/v2-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Catalog package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-catalog-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/catalog-v0.1.0/bke-catalog-0.1.0.tgz
          echo "765f266a70c16ef6a722744cb51adf290294b430f8bfb35e81ae7252f675c1d5  $artifact" | sha256sum -c -
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Catalog consumer adoption and staging retirement
        run: npx tsx v2/modules/catalog/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate package-backed Catalog Prisma schema
        run: npx prisma validate --schema node_modules/@bke/catalog/prisma/schema.prisma
      - name: Apply package-backed Catalog migrations
        run: node v2/platform/persistence/migration-compositor.mjs catalog node_modules/@bke/catalog/migrations
      - name: Prove package-backed Catalog migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs catalog node_modules/@bke/catalog/migrations
