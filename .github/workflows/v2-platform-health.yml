name: Platform - Health

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/health/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence/observability reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/|process\.env|observability|metrics)' platform/health --include='*.ts'; then
            echo "Health must remain a generic liveness/readiness seam."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Health platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/health/test/health.test.ts
