name: V2 Platform - Health

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/platform/health/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject V1/domain/persistence/observability reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|v2/modules|generated/prisma|from ["'"'"']@prisma/|process\.env|observability|metrics)' v2/platform/health --include='*.ts'; then
            echo "V2 Health must remain a generic liveness/readiness seam."
            exit 1
          fi
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Certify Health platform behavior
        run: npx vitest run --config v2/vitest.config.ts v2/platform/health/test/health.test.ts
