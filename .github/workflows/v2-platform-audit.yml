name: V2 Platform - Audit

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/platform/audit/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject V1/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|v2/modules|generated/prisma|from ["'"'"']@prisma/)' v2/platform/audit --include='*.ts'; then
            echo "V2 Audit platform seam must not reach through V1, domain packages, or Prisma."
            exit 1
          fi
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Certify Audit platform behavior
        run: npx vitest run --config v2/vitest.config.ts v2/platform/audit/test/audit.test.ts
