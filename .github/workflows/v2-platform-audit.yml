name: Platform - Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/audit/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "vitest.architecture.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v2-platform-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject legacy/domain/persistence reach-through
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(@/lib|@bke/|modules|generated/prisma|from ["'"'"']@prisma/)' platform/audit --include='*.ts'; then
            echo "Audit platform seam must not reach through legacy, domain packages, or Prisma."
            exit 1
          fi
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Certify Audit platform behavior
        run: npx vitest run --config vitest.architecture.config.ts platform/audit/test/audit.test.ts
