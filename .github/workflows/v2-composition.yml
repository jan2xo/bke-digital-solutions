name: Composition

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Identity package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-identity-0.3.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/identity-v0.3.0/bke-identity-0.3.0.tgz
          echo "5d8820122de15e0b500f6e3cccfdeeec6b63afbb361daa1dee3fc217e1c3f139  $artifact" | sha256sum -c -
      - name: Verify certified Accounts package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-accounts-0.4.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/accounts-v0.4.0/bke-accounts-0.4.0.tgz
          echo "59503141f2b7bbbe561db643b1df090907844781b9cf8464ee5e1569a425ae98  $artifact" | sha256sum -c -
      - name: Verify certified Legal package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-legal-0.4.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/legal-v0.4.0/bke-legal-0.4.0.tgz
          echo "9217b9dc617ac1c4621b0fc0f933ea5e49ea336175380d99153e1511f7714cc9  $artifact" | sha256sum -c -
      - name: Verify certified Licensing package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-licensing-0.9.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/licensing-v0.9.0/bke-licensing-0.9.0.tgz
          echo "afb66b9c2c7ae514b3a9afcc7b6eeccbb697e1a6f361cd85fc765b356b978e89  $artifact" | sha256sum -c -
      - name: Verify certified Entitlements package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-entitlements-0.1.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/entitlements-v0.1.0/bke-entitlements-0.1.0.tgz
          echo "f9c0bb1d464c9271076333a6c5012478cd9bc3cec9e9571a3ba4c2b0d2b1257b  $artifact" | sha256sum -c -
      - name: Verify certified Payments package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-payments-0.9.0.tgz
          curl -fL --retry 3 --retry-all-errors -o "$artifact" https://github.com/jan2xo/bke-libraries-typescript/releases/download/payments-v0.9.0/bke-payments-0.9.0.tgz
          echo "9ab16f457bc308fc26935ed47b3b8f2cfae3eb28036a3751f6460e3e93217f27  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Identity standalone consumer adoption
        run: npx tsx modules/identity/test/consumer-adoption.certify.ts
      - name: Certify Accounts standalone consumer adoption
        run: npx tsx modules/accounts/test/consumer-adoption.certify.ts
      - name: Certify Legal standalone consumer adoption
        run: npx tsx modules/legal/test/consumer-adoption.certify.ts
      - name: Certify Licensing standalone consumer adoption
        run: npx tsx modules/licensing/test/consumer-adoption.certify.ts
      - name: Certify Entitlements standalone consumer adoption
        run: npx tsx modules/entitlements/test/consumer-adoption.certify.ts
      - name: Certify Payments standalone consumer adoption
        run: npx tsx modules/payments/test/consumer-adoption.certify.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Test composition root
        run: npx vitest run --config vitest.architecture.config.ts platform/composition/test/composer.test.ts
      - name: Boot disposable composition
        run: npx tsx apps/orchestrator/bootstrap.ts
