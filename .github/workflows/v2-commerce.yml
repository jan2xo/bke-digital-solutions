name: Module - Commerce

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/commerce/**"
      - "app/api/agent-sessions/store/checkout-review/route.ts"
      - "tests/agent-session-checkout-review.test.ts"
      - "app/api/agent-sessions/store/checkout-start/route.ts"
      - "app/api/checkout/route.ts"
      - "apps/web/licensing/self-purchase-continuation.ts"
      - "apps/web/licensing/self-purchase-continuation-policy.ts"
      - "tests/agent-session-checkout-start.test.ts"
      - "tests/licensing-self-purchase-continuation.test.ts"
      - "tests/licensing-self-purchase-route-adoption.test.ts"
      - "app/api/agent-sessions/store/checkout-status/route.ts"
      - "tests/agent-session-checkout-status.test.ts"
      - "app/api/agent-sessions/store/route.ts"
      - "apps/web/catalog/agent-store-catalog.ts"
      - "tests/v3-agent-store-catalog-contract.test.ts"
      - "app/page.tsx"
      - "app/products/[slug]/page.tsx"
      - "app/api/admin/offers/**"
      - "lib/pricing.ts"
      - "lib/offers.ts"
      - "platform/persistence/migration-compositor.mjs"
      - "platform/composition/**"
      - "contracts/**"
      - "tooling/check-module-boundaries.mjs"
      - "tsconfig.architecture.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/v2-commerce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Commerce package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-commerce-0.15.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/commerce-v0.15.0/bke-commerce-0.15.0.tgz
          echo "798e28a21e4c3ad0e87cf327662e77db3843cec89e6eda67170a66ba4e0a6003  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Commerce consumer adoption and staging retirement
        run: npx tsx modules/commerce/test/consumer-adoption.certify.ts
      - name: Certify Agent Store catalog boundary
        run: npx vitest run tests/v3-agent-store-catalog-contract.test.ts
      - name: Certify Agent Store checkout review boundary
        run: npx vitest run tests/agent-session-checkout-review.test.ts
      - name: Certify Agent Store checkout start boundary
        run: npx vitest run tests/agent-session-checkout-start.test.ts
      - name: Certify buy-or-extend self-purchase semantics
        run: npx vitest run tests/licensing-self-purchase-continuation.test.ts tests/licensing-self-purchase-route-adoption.test.ts
      - name: Certify Agent Store checkout recovery boundary
        run: npx vitest run tests/agent-session-checkout-status.test.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate package-backed Commerce Prisma schema
        run: npx prisma validate --schema node_modules/@bke/commerce/prisma/schema.prisma
      - name: Apply package-backed Commerce migrations
        run: node platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
      - name: Prove package-backed Commerce migration idempotence
        run: node platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
