name: Module - Commerce

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commerce-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_commerce
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Commerce package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=/tmp/bke-commerce-0.17.0.tgz
          curl -fL --retry 3 --retry-all-errors \
            -o "$artifact" \
            https://github.com/jan2xo/bke-libraries-typescript/releases/download/commerce-v0.17.0/bke-commerce-0.17.0.tgz
          echo "2822677589c6f0c10d7832b65fec1d0303a955e3f0e7c7b986c6d9efe2266097  $artifact" | sha256sum -c -
      - name: Enforce module boundaries
        run: node tooling/check-module-boundaries.mjs
      - name: Certify Commerce consumer adoption and staging retirement
        run: npx tsx modules/commerce/test/consumer-adoption.certify.ts
      - name: Typecheck architecture
        run: npx tsc -p tsconfig.architecture.json --noEmit
      - name: Validate package-backed Commerce Prisma schema
        run: npx prisma validate --schema node_modules/@bke/commerce/prisma/schema.prisma
      - name: Apply package-backed Commerce migrations
        run: node platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
      - name: Prove package-backed Commerce migration idempotence
        run: node platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
