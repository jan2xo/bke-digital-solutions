name: V2 Module - Commerce

on:
  pull_request:
    branches: [develop/v2]
    paths:
      - "v2/modules/commerce/**"
      - "v2/platform/persistence/migration-compositor.mjs"
      - "v2/platform/composition/**"
      - "v2/contracts/**"
      - "v2/tooling/check-module-boundaries.mjs"
      - "v2/tsconfig.json"
      - "v2/vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/v2-commerce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_v2_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_v2_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_v2_commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify certified Commerce package artifact
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/jan2xo/bke-libraries-typescript/releases/download/commerce-v0.1.0/bke-commerce-0.1.0.tgz"
          expected="9cdb41e3607c87768a44c71d1eca690ddb23b5ff175c2eef1f4ebb2b9907bc14"
          curl -fL --retry 3 --retry-all-errors -o /tmp/bke-commerce-0.1.0.tgz "$url"
          actual="$(sha256sum /tmp/bke-commerce-0.1.0.tgz | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Enforce V2 module boundaries
        run: node v2/tooling/check-module-boundaries.mjs
      - name: Certify Commerce extraction boundary
        run: npx tsx v2/modules/commerce/test/extraction.certify.ts
      - name: Certify Commerce consumer adoption
        run: npx tsx v2/modules/commerce/test/consumer-adoption.certify.ts
      - name: Typecheck V2
        run: npx tsc -p v2/tsconfig.json --noEmit
      - name: Validate package-backed Commerce Prisma schema
        run: npx prisma validate --schema node_modules/@bke/commerce/prisma/schema.prisma
      - name: Apply package-backed Commerce migrations
        run: node v2/platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
      - name: Prove package-backed Commerce migration idempotence
        run: node v2/platform/persistence/migration-compositor.mjs commerce node_modules/@bke/commerce/migrations
      - name: Regression-test Commerce purchase-plan pricing
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/purchase-plan-pricing.test.ts
      - name: Regression-test Commerce purchase-plan lookup
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/purchase-plan-lookup.test.ts
      - name: Certify Commerce purchase-plan lookup with PostgreSQL
        run: npx tsx v2/modules/commerce/test/purchase-plan-lookup.postgres.certify.ts
      - name: Regression-test Commerce offer redemption
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/offer-redemption.test.ts
      - name: Certify Commerce offer redemption with PostgreSQL
        run: npx tsx v2/modules/commerce/test/offer-redemption.postgres.certify.ts
      - name: Regression-test Commerce order and invoice creation
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/order-invoice-creation.test.ts
      - name: Certify Commerce order and invoice creation with PostgreSQL
        run: npx tsx v2/modules/commerce/test/order-invoice-creation.postgres.certify.ts
      - name: Regression-test Commerce checkout orchestration
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/checkout-orchestration.test.ts
      - name: Regression-test Commerce settlement reaction
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/settlement-reaction.test.ts
      - name: Test Commerce host module composition
        run: npx vitest run --config v2/vitest.config.ts v2/modules/commerce/test/module-composition.test.ts
