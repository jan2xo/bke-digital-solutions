name: Temporary Grace Lock 0.8.1

on:
  push:
    branches: [tmp/grace-lock-0.8.1]
    paths:
      - ".github/workflows/tmp-grace-lock-081.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/grace-lock-0.8.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate canonical Licensing 0.8.1 lock
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@bke/licensing'] = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/licensing-v0.8.1/bke-licensing-0.8.1.tgz';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(tmp): resolve licensing 0.8.1 lock" || exit 0
          git push origin HEAD:tmp/grace-lock-0.8.1
