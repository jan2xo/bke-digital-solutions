name: Temporary Payments Lock Refresh

on:
  push:
    branches:
      - feat/v2-webhooks-owner-adoption

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-webhooks-owner-adoption
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin released Payments and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@bke/payments'] = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/payments-v0.7.0/bke-payments-0.7.0.tgz';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const lock = require('./package-lock.json');
          const root = lock.packages[''].dependencies['@bke/payments'];
          const entry = lock.packages['node_modules/@bke/payments'];
          const expectedUrl = 'https://github.com/jan2xo/bke-libraries-typescript/releases/download/payments-v0.7.0/bke-payments-0.7.0.tgz';
          const expectedIntegrity = 'sha512-UDbr9iPa5bb/cm3X/ZvlrK6oQcKS3z1EwvRuu3VFCOyVPXMVUP3SwHBMamgPN1kJ/yQ2w5IEc+QckAB2SnMzZQ==';
          if (root !== expectedUrl) throw new Error(`root Payments pin drifted: ${root}`);
          if (!entry || entry.version !== '0.7.0' || entry.resolved !== expectedUrl || entry.integrity !== expectedIntegrity) {
            throw new Error(`Payments lock evidence mismatch: ${JSON.stringify(entry)}`);
          }
          console.log('Payments 0.7.0 lock evidence GREEN');
          NODE
      - name: Remove one-shot helper and commit deterministic lock refresh
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-refresh-payments-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/tmp-refresh-payments-lock.yml
          git diff --cached --check
          git commit -m 'build(v2 payments): pin released payments 0.7.0'
          git push origin HEAD:feat/v2-webhooks-owner-adoption
