name: Temporary V2 Adoption Lock Refresh

on:
  pull_request:
    branches: [feat/v2-payment-webhook-ingestion-convergence]
    paths:
      - "package.json"
      - ".github/workflows/v2-adoption-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate npm lock from immutable release pins
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(v2): refresh released module lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
