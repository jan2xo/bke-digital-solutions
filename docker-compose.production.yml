name: bke-digital-solutions

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-environment: &runtime-environment
  - NODE_ENV
  - DEPLOYMENT_ENV
  - DEPLOYMENT_ID
  - APP_URL
  - INTERNAL_APP_URL
  - PUBLIC_WEBHOOK_ORIGIN
  - LOCAL_PRODUCTION_SIMULATION
  - TRUSTED_ORIGINS
  - TRUST_PROXY_HOPS
  - DATABASE_URL
  - DIRECT_DATABASE_URL
  - SESSION_SECRET
  - MFA_ENCRYPTION_KEY
  - LICENSE_PEPPER
  - LICENSE_SIGNING_KEY_ID
  - LICENSE_SIGNING_PRIVATE_KEY
  - LICENSE_SIGNING_PUBLIC_KEY
  - SUPPLY_CHAIN_SIGNING_KEY_ID
  - SUPPLY_CHAIN_SIGNING_PRIVATE_KEY
  - SUPPLY_CHAIN_SIGNING_PUBLIC_KEY
  - SUPPLY_CHAIN_TRUSTED_KEYS
  - ALLOW_BREAK_GLASS
  - ADMIN_OWNER_RECOVERY_KEY
  - ADMIN_OWNER_RECOVERY_KEY_VERSION
  - MALWARE_SCANNER_PROVIDER
  - MALWARE_SCANNER_VERSION
  - MALWARE_SCANNER_HOST
  - MALWARE_SCANNER_PORT
  - MALWARE_SCANNER_TIMEOUT_MS
  - MALWARE_SCANNER_MAX_BYTES
  - PROVIDER_CREDENTIALS_ENCRYPTION_KEY
  - PROVIDER_CREDENTIALS_KEY_VERSION
  - PROVIDER_CREDENTIALS_PREVIOUS_KEYS
  - PROVIDER_CONFIG_SOURCE
  - PROVIDER_CONFIG_ALLOW_ENV_FALLBACK
  - PAYMENT_PROVIDER
  - PAYMONGO_SECRET_KEY
  - PAYMONGO_WEBHOOK_SECRET
  - PAYMONGO_LIVEMODE
  - PAYMONGO_SANDBOX_WEBHOOK_PAYLOAD_FILE
  - PAYMONGO_SANDBOX_WEBHOOK_SIGNATURE_FILE
  - PAYMONGO_SANDBOX_PAYMENT_ID
  - PAYMONGO_SANDBOX_ORDER_ID
  - RESEND_API_KEY
  - RESEND_SANDBOX_TO
  - EMAIL_PROVIDER
  - EMAIL_FROM
  - SUPPORT_EMAIL
  - BUSINESS_ADDRESS
  - REDIS_URL
  - REDIS_KEY_PREFIX
  - UPSTASH_REDIS_REST_URL
  - UPSTASH_REDIS_REST_TOKEN
  - S3_ENDPOINT
  - S3_REGION
  - S3_BUCKET
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - S3_FORCE_PATH_STYLE
  - MAX_ARTIFACT_BYTES
  - CRON_SECRET
  - SEED_DEMO_DATA
  - LOG_LEVEL
  - ALLOW_DESTRUCTIVE_ADMIN
  - MONITORING_DSN
  - BACKUP_ENABLED
  - BACKUP_S3_ENDPOINT
  - BACKUP_S3_REGION
  - BACKUP_BUCKET
  - BACKUP_S3_ACCESS_KEY_ID
  - BACKUP_S3_SECRET_ACCESS_KEY
  - BACKUP_S3_FORCE_PATH_STYLE
  - BACKUP_ENCRYPTION_KEY
  - BACKUP_ENCRYPTION_KEY_VERSION
  - BACKUP_RETENTION_DAILY
  - BACKUP_RETENTION_WEEKLY
  - BACKUP_RETENTION_MONTHLY
  - BACKUP_WORKER_POLL_SECONDS
  - BACKUP_RESTORE_DATABASE_URL
  - BACKUP_RESTORE_S3_BUCKET
  - BACKUP_RESTORE_ACK
  - BACKUP_OFFSITE_ACK

services:
  app:
    build:
      context: .
      target: runner
    environment: *runtime-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      clamav: { condition: service_healthy }
    networks: [private, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.4
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  scheduler:
    build:
      context: .
      target: scheduler
    environment: *runtime-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      app: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://app:3000/api/health/scheduler').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='healthy')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    logging: *default-logging

  backup-worker:
    build:
      context: .
      target: backup-worker
    environment: *runtime-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [private, egress]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrations
    environment: *runtime-environment
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    logging: *default-logging

  operations:
    build:
      context: .
      target: operations
    environment: *runtime-environment
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    logging: *default-logging

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped
    stop_grace_period: 60s
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 256
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    volumes: ["valkey_data:/data"]
    networks: [private]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 128
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    volumes: ["object_data:/data"]
    networks: [private]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - DEPLOYMENT_ENV
      - MC_CONFIG_DIR=/tmp/.mc
    depends_on:
      minio: { condition: service_healthy }
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    logging: *default-logging

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LICENSING_AGENT_STORAGE_PATH:-/opt/bkes/licensing-agent}:/opt/bkes/licensing-agent:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 256
    logging: *default-logging

networks:
  private:
    internal: true
  egress:

volumes:
  postgres_data:
  valkey_data:
  object_data:
  caddy_data:
  caddy_config:
