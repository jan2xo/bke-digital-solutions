name: bke-digital-solutions

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      target: runner
    env_file: ${BKE_ENV_FILE:-.env.production.example}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [private, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  scheduler:
    build:
      context: .
      target: scheduler
    env_file: ${BKE_ENV_FILE:-.env.production.example}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      app: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrations
    env_file: ${BKE_ENV_FILE:-.env.production.example}
    profiles: ["operations"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    logging: *default-logging

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped
    stop_grace_period: 60s
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    volumes: ["valkey_data:/data"]
    networks: [private]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    volumes: ["object_data:/data"]
    networks: [private]
    profiles: ["self-hosted-storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  private:
    internal: true
  egress:

volumes:
  postgres_data:
  valkey_data:
  object_data:
  caddy_data:
  caddy_config:
