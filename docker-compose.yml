services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bke
      POSTGRES_PASSWORD: bke
      POSTGRES_DB: bke
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bke"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ["6379:6379"]
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    volumes: ["./fixtures:/fixtures:ro"]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 minioadmin minioadmin-dev-only; do sleep 1; done; mc mb --ignore-existing local/bke-private; mc cp /fixtures/bke-installer.bin local/bke-private/installers/bke-installer.bin"]
volumes:
  postgres_data:
  valkey_data:
  minio_data:
