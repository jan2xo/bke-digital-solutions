services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bke
      POSTGRES_PASSWORD: bke
      POSTGRES_DB: bke
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bke"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
